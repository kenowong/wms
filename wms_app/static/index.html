async function applyOpening(){
  confirm2('确认「应用期初」？将先保存各页签未保存的内容，再作为核算起点；应用后不可随意修改（需重置须未发生业务单据）。', async ()=>{
    try{
      if(_opTab) _opDraft[_opTab]=collectOpRows(_opTab); // 捕获当前页签
      const tabs=['inv','debt','bank','cash','asset'];
      const paths={inv:'/opening/inventory',debt:'/opening/debt',bank:'/opening/bank',cash:'/opening/cash',asset:'/opening/asset'};
      for(const t of tabs){
        if(_opDraft[t]!==null){
          await post(paths[t],{items:_opDraft[t]});
          _opDraft[t]=null;
        }
      }
      const r=await post('/opening/apply',{});
      toast(r&&r.msg?r.msg:'应用成功');
      await loadOpening();
    }catch(e){ toast(e.message,'error'); }
  });
}

function showLoginOverlay(errMsg=''){
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('login-err').textContent = errMsg;
  document.getElementById('login-user').value = '';
  document.getElementById('login-pwd').value = '';
  setTimeout(()=>document.getElementById('login-user').focus(), 100);
}

function hideLoginOverlay(){
  document.getElementById('login-overlay').classList.add('hidden');
}

async function doLogin(){
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pwd').value;
  const errEl = document.getElementById('login-err');
  if(!username){ errEl.textContent='请输入用户名'; return; }
  if(!password){ errEl.textContent='请输入密码'; return; }
  errEl.textContent='登录中…';
  try{
    const res = await fetch(API+'/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const d = await res.json();
    if(!res.ok){ errEl.textContent = d.detail||'登录失败'; return; }
    // 登录成功
    _session = {token: d.token, username: d.username, display_name: d.display_name, role: d.role, permissions: d.permissions||''};
    localStorage.setItem('wms_token', d.token);
    localStorage.setItem('wms_session', JSON.stringify(_session));
    hideLoginOverlay();
    applySession();
    pageDashboard();
  }catch(e){
    errEl.textContent = '连接服务器失败，请稍候重试';
  }
}

async function doLogout(){
  if(!confirm('确定退出登录？')) return;
  try{ await fetch(API+'/auth/logout',{method:'POST',headers:{'X-Token':getToken()}}); }catch(e){}
  localStorage.removeItem('wms_token');
  localStorage.removeItem('wms_session');
  _session = null;
  showLoginOverlay();
}

function applySession(){
  if(!_session) return;
  const roleText = ROLE_LABELS[_session.role] || _session.role;
  document.getElementById('topbar-uname').textContent = _session.display_name || _session.username;
  document.getElementById('topbar-urole').textContent = roleText;
  document.getElementById('topbar-user').style.display = 'flex';
  // admin 可见「用户管理」
  document.querySelectorAll('.admin-only').forEach(el=>{
    el.style.display = _session.role==='admin' ? '' : 'none';
  });
  // 按模块权限隐藏菜单（admin 拥有全部模块）
  if(_session.role === 'admin'){
    document.querySelectorAll('.nav-item[data-perm]').forEach(el=> el.style.display='');
  }else{
    const perms = (_session.permissions||'').split(',').map(s=>s.trim()).filter(Boolean);
    document.querySelectorAll('.nav-item[data-perm]').forEach(el=>{
      const m = el.getAttribute('data-perm');
      el.style.display = perms.includes(m) ? '' : 'none';
    });
  }
  loadUsers();  // 加载用户列表，供业务人员下拉
  loadCompanyInfo();  // 加载公司信息（打印抬头）
}

// ══════════════════════════════════════
// 初始化：尝试恢复已有 session
// ══════════════════════════════════════
(async function init(){
  const savedSession = localStorage.getItem('wms_session');
  const savedToken = localStorage.getItem('wms_token');
  if(savedSession && savedToken){
    try{
      const s = JSON.parse(savedSession);
      _session = {...s, token: savedToken};
      // 验证 token 有效性
      const r = await fetch(API+'/auth/me',{headers:{'X-Token':savedToken}});
      if(r.ok){
        const me = await r.json();
        _session.role = me.role;
        _session.display_name = me.display_name;
        _session.permissions = me.permissions||'';
        hideLoginOverlay();
        applySession();
        pageDashboard();
        return;
      }
    }catch(e){}
  }
  // token 无效或不存在，显示登录页
  showLoginOverlay();
})();

async function importGoods(input){
  const file = input.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append('file', file);
  input.value = '';
  toast('正在导入，请稍候…');
  try{
    const res = await fetch('/api/system/import/goods',{method:'POST',body:fd});
    const d = await res.json();
    if(!res.ok) throw new Error(d.detail||'导入失败');
    let msg = `导入完成：新增 ${d.added} 条，更新 ${d.updated} 条`;
    if(d.skipped) msg += `，跳过 ${d.skipped} 条`;
    toast(msg, d.skipped?'warn':'success');
    if(d.errors && d.errors.length){
      console.warn('导入错误:', d.errors);
      setTimeout(()=>alert('部分行导入失败：\n'+d.errors.slice(0,10).join('\n')),300);
    }
    loadGoods(); loadCaches();
  }catch(e){ toast(e.message,'error'); }
}

  {k:'doc_no',t:'单号'},{k:'doc_date',t:'日期'},{k:'doc_title',t:'单据标题'},{k:'partner',t:'往来单位'},

  {k:'balance_amount',t:'余额'},{k:'total_order_amount',t:'应收/付总额'},{k:'total_paid_amount',t:'已收/付金额'},

  {k:'company_phone',t:'公司电话'},{k:'company_tax_no',t:'税号'},{k:'remark',t:'备注'},{k:'print_time',t:'打印时间'}

function FIELD_OPTS(sel){
  return PTED_FIELDS.map(function(f){return '<option value="'+f.k+'"'+(f.k===sel?' selected':'')+'>'+f.t+'</option>';}).join('');
}
function extractField(inner){ const m=String(inner||'').match(/\{\{\s*(\w+)\s*\}\}/); return m?m[1]:null; }
function cleanLabel(txt){ return String(txt||'').replace(/\{\{[^}]+\}\}/g,'').replace(/[：:\s]/g,'').slice(0,8)||'字段'; }
function newBlock(type){
  switch(type){
    case 'head': return {type:'head'};
    case 'meta': return {type:'meta', fields:[{label:'项目',field:'project_name'}]};
    case 'text': return {type:'text', text:'说明文字（可修改）'};
    case 'field': return {type:'field', label:'字段', field:'doc_no'};
    case 'items': return {type:'items'};
    case 'total': return {type:'total', label:'合计金额', field:'amount'};
    case 'remark': return {type:'remark'};
    case 'foot': return {type:'foot', left:'制单：{{operator}}', right:'打印时间：{{print_time}}'};
  }
  return {type:'text', text:''};
}
function defaultBlocksFor(dt){
  return [
    {type:'head'},
    {type:'meta', fields:[{label:'单号',field:'doc_no'},{label:'日期',field:'doc_date'},{label:'往来单位',field:'partner'},{label:'经手人',field:'operator'}]},

    {type:'remark'},
    {type:'foot', left:'制单：{{operator}}', right:'打印时间：{{print_time}}'}
  ];
}
function blocksToHtml(blocks){
  return (blocks||[]).map(function(b){
    switch(b.type){
      case 'head': return '<div class="pt-head"><div class="pt-company">{{company}}</div><div class="pt-sub">{{company_address}}　{{company_phone}}　{{company_tax_no}}</div><div class="pt-title">{{doc_title}}</div></div>';
      case 'meta': return '<div class="pt-meta">'+(b.fields||[]).map(function(f){return '<span class="pt-ml" style="margin-right:18px" data-label="'+escAttr(f.label)+'" data-field="'+f.field+'">'+escHtml(f.label)+'：{{'+f.field+'}}</span>';}).join('')+'</div>';
      case 'text': return '<div style="margin:6px 0;font-size:13px;line-height:1.7">'+escHtml(b.text||'')+'</div>';
      case 'field': return '<div class="pt-info"><span class="pt-label">'+escHtml(b.label)+'：</span>{{'+b.field+'}}</div>';
      case 'items': return '<div class="pt-items">{{items}}</div>';
      case 'total': return '<div class="pt-total">'+escHtml(b.label)+'：{{'+b.field+'}}</div>';
      case 'remark': return '<div class="pt-remark">备注：{{remark}}</div>';
      case 'foot': return '<div class="pt-foot"><span>'+escHtml(b.left||'')+'</span><span>'+escHtml(b.right||'')+'</span></div>';
    }
    return '';
  }).join('\n');
}
function parseHtmlToBlocks(html){
  const tmp = document.createElement('div'); tmp.innerHTML = html||'';
  const out = []; const consumed = new Set();
  function pushNode(node){
    const cls = node.className||''; const txt = node.textContent||'';
    if(cls.indexOf('pt-head')>=0){ out.push({type:'head'}); }
    else if(node.tagName==='TABLE' && cls.indexOf('ptb')>=0){ out.push({type:'items'}); }
    else if(cls.indexOf('pt-total')>=0){ out.push({type:'total', label:(txt.split('：')[0]||'合计').replace(/：/g,''), field:extractField(node.innerHTML)||'amount'}); }
    else if(cls.indexOf('pt-remark')>=0){ if(node.innerHTML.indexOf('{{remark}}')>=0) out.push({type:'remark'}); else out.push({type:'text', text:node.textContent||''}); }
    else if(cls.indexOf('pt-foot')>=0){ const sp=node.querySelectorAll('span'); out.push({type:'foot', left:sp[0]?sp[0].innerHTML:'', right:sp[1]?sp[1].innerHTML:''}); }
    else if(cls.indexOf('pt-items')>=0){ out.push({type:'items'}); }
    else if(cls.indexOf('pt-meta')>=0){ const fields=[]; const mls=node.querySelectorAll?node.querySelectorAll('.pt-ml'):[]; if(mls&&mls.length){ Array.prototype.forEach.call(mls, function(sp){ fields.push({label:sp.getAttribute('data-label')||sp.textContent.split('：')[0]||'字段', field:sp.getAttribute('data-field')||extractField(sp.innerHTML)||''}); }); } else { const re=/([^：:]*?)[：:]\s*\{\{\s*(\w+)\s*\}\}/g; let mm; while((mm=re.exec(node.innerHTML))){ fields.push({label:(mm[1].replace(/<[^>]+>/g,'')||'字段').trim(), field:mm[2]}); } } if(fields.length) out.push({type:'meta', fields:fields}); else out.push({type:'text', text:node.textContent||''}); }
    else if(cls.indexOf('pt-info')>=0){ out.push({type:'field', label:(txt.split('：')[0]||'字段').replace(/：/g,''), field:extractField(node.innerHTML)||''}); }
    else { const f=extractField(node.innerHTML); if(f) out.push({type:'field', label:cleanLabel(txt), field:f}); else out.push({type:'text', text:node.textContent||''}); }
  }
  function walk(nodes){
    Array.prototype.forEach.call(nodes, function(node){
      if(consumed.has(node)) return;
      const cls = node.className||'';
      const sem = (cls.indexOf('pt-head')>=0) || (node.tagName==='TABLE' && cls.indexOf('ptb')>=0)
        || (cls.indexOf('pt-total')>=0) || (cls.indexOf('pt-remark')>=0) || (cls.indexOf('pt-foot')>=0)
        || (cls.indexOf('pt-meta')>=0) || (cls.indexOf('pt-info')>=0) || (cls.indexOf('pt-items')>=0);
      if(sem){
        consumed.add(node);
        if(node.querySelectorAll) Array.prototype.forEach.call(node.querySelectorAll('*'), function(d){ consumed.add(d); });
        pushNode(node);
      } else if(node.children && node.children.length){
        walk(node.children);
      }
    });
  }
  walk(tmp.children);
  return out;
}
function ptedSummary(b){
  switch(b.type){
    case 'head': return '抬头（公司名称 + 地址/电话/税号 + 单据标题）';
    case 'meta': return '信息行：'+((b.fields||[]).map(function(f){return f.label;}).join('、')||'（空）');
    case 'text': return '文本：'+(b.text||'').slice(0,20);
    case 'field': return b.label+'：{{'+b.field+'}}';
    case 'items': return '明细表（{{items}}）';
    case 'total': return b.label+'：{{'+b.field+'}}';
    case 'remark': return '备注（{{remark}}）';
    case 'foot': return '页脚';
  }
  return b.type;
}

    `,

     <button class="btn" onclick="previewPrintTemplate('${dt}')">👁 预览打印</button>
     <button class="btn btn-primary" onclick="savePrintTemplate('${dt}')">💾 保存模板</button>`);

  }catch(e){ toast(e.message, 'error'); }
}
function ptedReset(){ const st=window._pted; if(!st)return; st.blocks=defaultBlocksFor(st.dt); st.sel=-1; ptedRender(); }
function ptedRender(){
  const st=window._pted; if(!st)return;
  const cv=document.getElementById('pted_canvas');
  if(cv) cv.innerHTML = st.blocks.length ? st.blocks.map(function(b,i){
    return '<div class="pted-block '+(i===st.sel?'sel':'')+'" onpointerdown="ptedStartDrag(event,\'move\','+i+')" onclick="ptedSelect('+i+')"><div class="pted-bar"><button class="btn" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();ptedMove('+i+',-1)">▲</button><button class="btn" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();ptedMove('+i+',1)">▼</button><button class="btn" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();ptedRemove('+i+')">✕</button></div><div class="pted-sum">'+escHtml(ptedSummary(b))+'</div></div>';
  }).join('') : '<div style="color:#bbb;text-align:center;padding:40px">从左侧拖入组件开始搭建</div>';
  ptedRenderProps();
  ptedRenderPreview();
}
function ptedRenderProps(){
  const st=window._pted; const pe=document.getElementById('pted_props'); if(!pe)return;
  const b=st.blocks[st.sel];
  if(!b){ pe.innerHTML='<div style="color:#bbb">选中画布中的区块，可在此编辑其属性</div>'; return; }
  let h='';
  if(b.type==='head'){ h='<div style="color:#888;line-height:1.6">抬头区包含公司名称、地址、电话、税号与单据标题，打印时自动填充，无需配置。</div>'; }
  else if(b.type==='items'){ h='<div style="color:#888;line-height:1.6">明细表自动渲染商品明细行（序号/名称/规格/单位/数量/单价/金额）。</div>'; }
  else if(b.type==='remark'){ h='<div style="color:#888;line-height:1.6">显示“备注：”及备注内容。</div>'; }
  else if(b.type==='meta'){
    h='<label>信息行字段（标签 + 数据）</label>';
    h+=(b.fields||[]).map(function(f,i){
      return '<div class="pted-frow"><input value="'+escAttr(f.label)+'" oninput="ptedMetaField('+st.sel+','+i+',\'label\',this.value)"><select onchange="ptedMetaField('+st.sel+','+i+',\'field\',this.value)">'+FIELD_OPTS(f.field)+'</select><button class="btn" onclick="ptedMetaDel('+st.sel+','+i+')">✕</button></div>';
    }).join('');
    h+='<button class="btn" onclick="ptedMetaAdd('+st.sel+')">＋ 加字段</button>';
  }
  else if(b.type==='text'){ h='<label>文本内容</label><textarea style="height:80px" oninput="ptedSet('+st.sel+',\'text\',this.value)">'+escHtml(b.text||'')+'</textarea>'; }
  else if(b.type==='field'){ h='<label>标签</label><input value="'+escAttr(b.label)+'" oninput="ptedSet('+st.sel+',\'label\',this.value)"><label>数据字段</label><select onchange="ptedSet('+st.sel+',\'field\',this.value)">'+FIELD_OPTS(b.field)+'</select>'; }
  else if(b.type==='total'){ h='<label>标签</label><input value="'+escAttr(b.label)+'" oninput="ptedSet('+st.sel+',\'label\',this.value)"><label>金额字段</label><select onchange="ptedSet('+st.sel+',\'field\',this.value)">'+FIELD_OPTS(b.field)+'</select>'; }
  else if(b.type==='foot'){ h='<label>左侧（支持占位符）</label><input value="'+escAttr(b.left||'')+'" oninput="ptedSet('+st.sel+',\'left\',this.value)"><label>右侧（支持占位符）</label><input value="'+escAttr(b.right||'')+'" oninput="ptedSet('+st.sel+',\'right\',this.value)">'; }
  pe.innerHTML=h;
}
function ptedRenderPreview(){
  const st=window._pted; const pv=document.getElementById('ptpl_preview'); if(!pv||!st)return;
  const content=blocksToHtml(st.blocks);
  const data=getPrintData(st.dt, getSamplePrintData(st.dt));
  const tEl=document.getElementById('ptpl_title');
  data.doc_title = tEl?tEl.value:(PRINT_DOC_TYPES[st.dt]||st.dt);
  pv.innerHTML = fillPrintTemplate(content, data);
}
function ptedSelect(i){ if(window._ptedClickGuard){ window._ptedClickGuard=false; return; } window._pted.sel=i; ptedRender(); }
function ptedMove(i,dir){ const st=window._pted; const to=i+dir; if(to<0||to>=st.blocks.length)return; moveBlock(i,to); }
function ptedRemove(i){ const st=window._pted; st.blocks.splice(i,1); if(st.sel===i)st.sel=-1; else if(st.sel>i)st.sel--; ptedRender(); }
function insertBlock(type,at){ const st=window._pted; const b=newBlock(type); if(at<0||at>st.blocks.length)at=st.blocks.length; st.blocks.splice(at,0,b); st.sel=at; ptedRender(); }
function moveBlock(from,to){ const st=window._pted; if(from<0||from>=st.blocks.length)return; const x=st.blocks.splice(from,1)[0]; if(to>from)to--; if(to<0)to=0; if(to>st.blocks.length)to=st.blocks.length; st.blocks.splice(to,0,x); st.sel=to; ptedRender(); }
let _ptedDrag=null;
function ptedCompName(t){ const m={head:'抬头',meta:'信息行',text:'文本',field:'字段',items:'明细表',total:'合计',remark:'备注',foot:'页脚'}; return m[t]||t; }
function ptedStartDrag(e, kind, val){
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  const ghost=document.createElement('div');
  ghost.id='pted_ghost';
  ghost.style.cssText='position:fixed;z-index:99999;pointer-events:none;background:#409eff;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;opacity:.92;box-shadow:0 2px 8px rgba(0,0,0,.2)';
  ghost.textContent = kind==='new' ? ('添加 '+ptedCompName(val)) : '移动区块';
  document.body.appendChild(ghost);
  _ptedDrag={kind:kind, val:String(val), ghost:ghost, moved:false, sx:e.clientX, sy:e.clientY};
  document.addEventListener('pointermove', ptedDragMove);
  document.addEventListener('pointerup', ptedDragEnd);
}
function ptedDragMove(e){
  if(!_ptedDrag)return;
  if(Math.abs(e.clientX-_ptedDrag.sx)>4 || Math.abs(e.clientY-_ptedDrag.sy)>4) _ptedDrag.moved=true;
  _ptedDrag.ghost.style.left=(e.clientX+10)+'px';
  _ptedDrag.ghost.style.top=(e.clientY+10)+'px';
}
function ptedDragEnd(e){
  if(!_ptedDrag)return;
  const d=_ptedDrag; const st=window._pted; const canvas=document.getElementById('pted_canvas');
  const el=document.elementFromPoint(e.clientX, e.clientY);
  let insertAt=st.blocks.length;
  if(canvas && el && canvas.contains(el)){
    let bEl=el;
    while(bEl && bEl!==canvas && !(bEl.classList && bEl.classList.contains('pted-block'))) bEl=bEl.parentElement;
    if(bEl && bEl.classList && bEl.classList.contains('pted-block')){
      const idx=Array.prototype.indexOf.call(canvas.children, bEl);
      const r=bEl.getBoundingClientRect();
      insertAt = (e.clientY < r.top + r.height/2) ? idx : idx+1;
    }
    if(d.kind==='new') insertBlock(d.val, insertAt);
    else { moveBlock(parseInt(d.val,10), insertAt); if(d.moved) window._ptedClickGuard=true; }
  } else if(d.kind==='new' && !d.moved){
    insertBlock(d.val, st.blocks.length);
  }
  d.ghost.remove(); _ptedDrag=null;
  document.removeEventListener('pointermove', ptedDragMove);
  document.removeEventListener('pointerup', ptedDragEnd);
}
function ptedSet(i,key,val){ const st=window._pted; st.blocks[i][key]=val; if(key==='text'||key==='left'||key==='right') ptedRenderPreview(); else ptedRender(); }
function ptedMetaField(bi,i,key,val){ const st=window._pted; if(!st.blocks[bi].fields)st.blocks[bi].fields=[]; st.blocks[bi].fields[i][key]=val; if(key==='label') ptedRenderPreview(); else ptedRender(); }
function ptedMetaAdd(bi){ const st=window._pted; if(!st.blocks[bi].fields)st.blocks[bi].fields=[]; st.blocks[bi].fields.push({label:'新字段',field:'doc_no'}); ptedRender(); }
function ptedMetaDel(bi,i){ const st=window._pted; st.blocks[bi].fields.splice(i,1); ptedRender(); }
async function savePrintTemplate(dt){
  const st=window._pted; const title=document.getElementById('ptpl_title').value;
  const content=blocksToHtml(st.blocks);
  try{ await put('/print/template/'+dt, {title:title, content:content}); toast('模板已保存'); }
  catch(e){ toast(e.message, 'error'); }
}
function previewPrintTemplate(dt){
  const st=window._pted; const title=document.getElementById('ptpl_title').value;
  const content=blocksToHtml(st.blocks);
  const data=getPrintData(dt, getSamplePrintData(dt));
  data.doc_title=title;
  const html=fillPrintTemplate(content, data);
  openPrintWindow(data.doc_title, html);
}

  const box=document.getElementById('perm_box');
  if(!box) return;
  const role=document.getElementById('u_role')?.value;
  if(role==='admin'){
    box.innerHTML='<span style="color:#888;font-size:13px">管理员拥有全部模块权限，无需单独设置</span>';
    return;
  }
  const perms=_editUserPerms;
  box.innerHTML=MODULE_LIST.map(([k,label])=>`<label style="display:inline-flex;align-items:center;gap:4px;margin:3px 12px 3px 0;font-size:13px;cursor:pointer"><input type="checkbox" class="perm-chk" value="${k}" ${perms.includes(k)?'checked':''}>${label}</label>`).join('');
}
async function saveUser(uid){
  const username = document.getElementById('u_username').value.trim();
  const display_name = document.getElementById('u_dname').value.trim();
  const role = document.getElementById('u_role').value;
  const pwd = document.getElementById('u_pwd').value;
  const status = parseInt(document.getElementById('u_status').value);
  // 仅非管理员需要收集模块权限；管理员权限由后端恒定为全权限
  let permissions = '';
  if(role !== 'admin'){
    permissions = Array.from(document.querySelectorAll('.perm-chk:checked')).map(c=>c.value).join(',');
  }
  if(!username){ toast('用户名不能为空','error'); return; }
  try{
    if(uid){
      const body = {display_name, role, status, permissions};
      if(pwd) body.password = pwd;
      await put('/users/'+uid, body);
      toast('更新成功');
    } else {
      if(!pwd){ toast('请设置密码','error'); return; }
      await post('/users', {username, password:pwd, display_name, role, status, permissions});
      toast('用户创建成功');
    }
    closeModal();
    loadUserTable();
  }catch(e){ toast(e.message,'error'); }
}

async function delUser(id, username){
  if(!confirm(`确定删除用户 "${username}"？`)) return;
  try{
    await del('/users/'+id);
    toast('删除成功');
    loadUserTable();
  }catch(e){ toast(e.message,'error'); }
}

// ══════════════════════════════════════
// 修改密码（topbar 或设置里触发）
// ══════════════════════════════════════
function showChangePwd(){
  showModal('修改密码',`
    <div class="form-grid">
      <div class="form-row"><label>原密码</label><input id="cp_old" type="password" placeholder="原密码"></div>
      <div class="form-row"><label>新密码</label><input id="cp_new" type="password" placeholder="至少4位"></div>
      <div class="form-row"><label>确认密码</label><input id="cp_confirm" type="password" placeholder="再次输入新密码"></div>
    </div>`,
    `<button class="btn btn-primary" onclick="doChangePwd()">保存</button>
     <button class="btn" onclick="closeModal()">取消</button>`
  );
}
async function doChangePwd(){
  const old_password = document.getElementById('cp_old').value;
  const new_password = document.getElementById('cp_new').value;
  const confirm = document.getElementById('cp_confirm').value;
  if(new_password !== confirm){ toast('两次密码不一致','error'); return; }
  try{
    await post('/auth/change_password',{old_password, new_password});
    toast('密码修改成功，下次登录生效');
    closeModal();
  }catch(e){ toast(e.message,'error'); }
}
