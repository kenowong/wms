<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进销存管理系统</title>
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon/icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
:root{--primary:#1677ff;--success:#52c41a;--warning:#faad14;--danger:#ff4d4f;--border:#d9d9d9;--bg:#fff;--sidebar-w:220px}

/* 布局 */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#001529,#002b4d);color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{padding:20px 16px;font-size:16px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px}
.sidebar-logo span{font-size:22px}
.nav-group{padding:8px 0}
.nav-title{padding:8px 16px;font-size:12px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:1px}
.nav-item{padding:10px 16px 10px 32px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;font-size:13px;color:rgba(255,255,255,.75)}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .icon{width:16px;text-align:center;flex-shrink:0}

/* 菜单分组折叠（手风琴） */
.nav-title{cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between}
.nav-title::after{content:'▾';font-size:10px;margin-left:auto;padding-left:8px;transition:transform .2s;opacity:.7}
.nav-title:hover{color:rgba(255,255,255,.85)}
.nav-group.collapsed .nav-title::after{transform:rotate(-90deg)}
.nav-group.collapsed .nav-item{display:none}

/* 项目流程状态色 & 甘特图 */
.task-status-1{color:#8c8c8c}.task-status-2{color:#1677ff}.task-status-3{color:#52c41a}.task-status-4{color:#ff4d4f}
.gantt{position:relative;font-size:12px;border:1px solid #eee;border-radius:6px;overflow:hidden;background:#fff}
.gantt-head{display:flex;border-bottom:1px solid #eee;background:#fafafa}
.gantt-head .gantt-label{font-weight:600}
.gantt-row{display:flex;border-bottom:1px solid #f5f5f5}
.gantt-row:last-child{border-bottom:none}
.gantt-label{width:160px;flex:none;padding:6px 8px;border-right:1px solid #f0f0f0;background:#fafafa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-track{position:relative;flex:1;min-height:30px}
.gantt-month{position:absolute;top:0;height:26px;font-size:11px;color:#888;padding:4px 6px;border-right:1px solid #f0f0f0;white-space:nowrap;overflow:hidden}
.gantt-bar{position:absolute;top:6px;height:18px;border-radius:4px;min-width:3px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.gantt-bar .gantt-progress{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.45)}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:#ff4d4f;z-index:6}
.gantt-today::after{content:'今天';position:absolute;top:1px;left:3px;font-size:10px;color:#ff4d4f;white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-title{font-size:16px;font-weight:600;color:#333}
.topbar-info{font-size:12px;color:#888}
.content{flex:1;overflow-y:auto;padding:20px}

/* 卡片 */
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;color:#333;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:16px;background:var(--primary);border-radius:2px;display:inline-block}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;right:-10px;top:-10px;width:80px;height:80px;border-radius:50%;opacity:.08}
.stat-card.blue::after{background:var(--primary)}
.stat-card.green::after{background:var(--success)}
.stat-card.orange::after{background:var(--warning)}
.stat-card.red::after{background:var(--danger)}
.stat-label{font-size:13px;color:#888;margin-bottom:8px}
.stat-value{font-size:26px;font-weight:700;color:#333}
.stat-sub{font-size:12px;color:#aaa;margin-top:4px}

/* 表格 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f0f0f0;white-space:nowrap}
th{background:#fafafa;font-weight:600;color:#666;font-size:13px}
tr:hover td{background:#fafffe}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500}
.badge-0{background:#fff7e6;color:#d46b08}
.badge-1{background:#e6f7ff;color:#0958d9}
.badge-2{background:#f6ffed;color:#389e0d}
.badge-3{background:#f0f9ff;color:#1890ff}
.badge-4{background:#f5f5f5;color:#666}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;transition:.2s;line-height:1}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#4096ff;border-color:#4096ff;color:#fff}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-warning{background:var(--warning);color:#fff;border-color:var(--warning)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-link{border:none;background:none;color:var(--primary);cursor:pointer;padding:2px 4px;font-size:12px}
.btn-link:hover{text-decoration:underline}

/* 表单 */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px}
.form-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-row label{font-size:13px;color:#666;font-weight:500}
.form-row input,.form-row select,.form-row textarea{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;transition:.2s;background:#fff;width:100%}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.form-actions{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid #f0f0f0}

/* 搜索栏 */
.search-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-bar input,.search-bar select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none}
.search-bar input:focus,.search-bar select:focus{border-color:var(--primary)}

/* 模态框 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:10px;padding:0;min-width:480px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h3{font-size:15px;font-weight:600}
.modal-close{cursor:pointer;font-size:18px;color:#888;line-height:1;padding:2px}
.modal-close:hover{color:#333}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* 明细表格 */
.detail-table{width:100%;border-collapse:collapse;margin-top:8px}
.detail-table th{background:#f5f5f5;padding:7px 8px;font-size:12px;font-weight:600;border:1px solid #e8e8e8}
.detail-table td{padding:5px 6px;border:1px solid #e8e8e8}
.detail-table td input,.detail-table td select{width:100%;padding:4px 6px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;outline:none}
.detail-table td input:focus{border-color:var(--primary)}
.add-item-btn{margin-top:8px}

/* 工具提示 */
.empty-tip{text-align:center;padding:40px;color:#aaa;font-size:14px}

/* 分页 */
.pagination{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:12px}
.pagination button{padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:13px}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* 进度条 */
.progress{height:6px;background:#e8e8e8;border-radius:3px;overflow:hidden}
.progress-inner{height:100%;background:var(--primary);border-radius:3px;transition:.3s}

/* 响应式 */
@media(max-width:1200px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr)}}

/* ═══ 移动端适配（手机 / 平板竖屏）═══ */
.menu-toggle{display:none;font-size:20px;line-height:1;cursor:pointer;background:none;border:none;color:#333;padding:6px 8px;margin-left:-8px}
.sidebar-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1090}
@media(max-width:768px){
  .menu-toggle{display:block}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;z-index:1100;transform:translateX(-100%);transition:transform .25s ease;box-shadow:2px 0 12px rgba(0,0,0,.3)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-mask.show{display:block}
  .logo-text{display:none}
  .topbar{padding:0 12px}
  .topbar-title{font-size:14px}
  .topbar-info{display:none}
  .content{padding:12px}
  .card{padding:14px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid,.form-grid-2{grid-template-columns:repeat(2,1fr)}
  .search-bar{flex-wrap:wrap;gap:8px}
  .modal{min-width:0;width:94vw;max-width:94vw}
  .modal-body{padding:16px}
  .detail-table th,.detail-table td{padding:6px 8px;font-size:12px;white-space:normal}
  .detail-table input,.detail-table select{padding:5px 6px;font-size:12px}
}
@media(max-width:480px){
  .stat-grid{grid-template-columns:1fr}
  .form-grid,.form-grid-2{grid-template-columns:1fr}
  .content{padding:10px}
  .card{padding:12px}
  .topbar-user{gap:6px}
  .topbar-user .urole{display:none}
  .modal{width:100vw;max-width:100vw;height:100vh;border-radius:0;max-height:100vh}
  .modal-header{padding:14px 16px}
  .modal-body{padding:14px}
  .modal-footer{padding:10px 14px}
  .table-wrap{margin:0 -10px}
  .login-box{width:90vw;max-width:360px;padding:32px 24px}
}

/* 手机竖屏（≤600px）：筛选栏控件满宽、打印模板编辑器纵向堆叠、宽表更紧凑 */
@media(max-width:600px){
  .search-bar input,.search-bar select{flex:1 1 100%;width:100%!important}
  .search-bar label{display:block;width:100%;margin:2px 0}
  .search-bar .btn{flex:1 1 auto}
  .pted-wrap{flex-direction:column}
  .pted-pan,.pted-props{width:100%;flex:none}
  .pted-canvas{min-height:240px}
  th,td{padding:7px 8px}
  table{font-size:12px}
}

/* 标签页 */
.tabs{display:flex;border-bottom:2px solid #f0f0f0;margin-bottom:16px;gap:0}
.tab{padding:10px 20px;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-color:var(--primary);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}

/* 标签 */
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;margin-right:4px}
.tag-blue{background:#e6f7ff;color:#1677ff;border:1px solid #91caff}
.tag-green{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.tag-orange{background:#fff7e6;color:#fa8c16;border:1px solid #ffd591}
.tag-red{background:#fff2f0;color:#ff4d4f;border:1px solid #ffccc7}
/* 登录覆盖层 */
#login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#001529 0%,#003566 100%);display:flex;align-items:center;justify-content:center;z-index:10000}
#login-overlay.hidden{display:none}
.login-box{background:#fff;border-radius:12px;padding:40px 48px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .icon{font-size:40px;display:block;margin-bottom:8px}
.login-logo h2{font-size:20px;color:#333;font-weight:700}
.login-logo p{font-size:13px;color:#999;margin-top:4px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:600}
.login-field input{width:100%;padding:10px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;outline:none;transition:.2s}
.login-field input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.15)}
.login-btn{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:.2s}
.login-btn:hover{background:#0958d9}
.login-err{color:#ff4d4f;font-size:13px;margin-top:8px;min-height:18px;text-align:center}
/* topbar 用户信息 */
.topbar-user{display:flex;align-items:center;gap:12px;font-size:13px}
.topbar-user .uname{color:#555;font-weight:600}
.topbar-user .urole{color:#888;font-size:12px;padding:2px 8px;background:#f0f2f5;border-radius:10px}
.topbar-user .logout-btn{color:#888;cursor:pointer;padding:4px 8px;border-radius:4px;transition:.2s;font-size:12px}
.topbar-user .logout-btn:hover{background:#f0f2f5;color:#333}
</style>
</head>
<body>
<!-- 登录覆盖层（未登录时显示，登录后隐藏） -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">
      <span class="icon">📦</span>
      <h2>进销存管理系统</h2>
      <p>请登录后继续使用</p>
    </div>
    <div class="login-field">
      <label>用户名</label>
      <input id="login-user" type="text" placeholder="请输入用户名" autocomplete="username"
             onkeydown="if(event.key==='Enter')document.getElementById('login-pwd').focus()">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input id="login-pwd" type="password" placeholder="请输入密码" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>
<div id="app">
  <div class="sidebar">
    <div class="sidebar-logo"><span>📦</span><span class="logo-text">进销存系统</span></div>
    <div class="nav-group">
      <div class="nav-title">总览</div>
      <div class="nav-item active" onclick="nav('dashboard')"><span class="icon">🏠</span>工作台</div>
    </div>
    <div class="nav-group">
      <div class="nav-title">基础档案</div>
      <div class="nav-item" data-perm="goods" onclick="nav('goods')"><span class="icon">📋</span>商品档案</div>
      <div class="nav-item" data-perm="categories" onclick="nav('categories')"><span class="icon">🗂️</span>商品分类</div>
      <div class="nav-item" data-perm="brands" onclick="nav('brands')"><span class="icon">🏷️</span>品牌管理</div>
      <div class="nav-item" data-perm="units" onclick="nav('units')"><span class="icon">📏</span>计量单位</div>
      <div class="nav-item" data-perm="partners" onclick="nav('partners')"><span class="icon">👥</span>往来单位</div>
      <div class="nav-item" data-perm="warehouses" onclick="nav('warehouses')"><span class="icon">🏭</span>仓库管理</div>
    </div>
    <div class="nav-group">
      <div class="nav-title">进销存</div>
      <div class="nav-item" data-perm="purchase" onclick="nav('purchase')"><span class="icon">🛒</span>采购入库</div>
      <div class="nav-item" data-perm="sale" onclick="nav('sale')"><span class="icon">🚚</span>销售出库</div>
      <div class="nav-item" data-perm="requisition" onclick="nav('requisition')"><span class="icon">🔧</span>耗材领用</div>
      <div class="nav-item" data-perm="inventory" onclick="nav('inventory')"><span class="icon">📊</span>库存台账</div>
      <div class="nav-item" data-perm="alert" onclick="nav('alert')"><span class="icon">⚠️</span>库存预警</div>
      <div class="nav-item" data-perm="logs" onclick="nav('logs')"><span class="icon">📜</span>库存流水</div>
      <div class="nav-item" data-perm="check" onclick="nav('check')"><span class="icon">🔍</span>库存盘点</div>
    </div>
    <div class="nav-group">
      <div class="nav-title">财务管理</div>
      <div class="nav-item" data-perm="bank_accounts" onclick="nav('bank_accounts')"><span class="icon">🏦</span>银行账户</div>
      <div class="nav-item" data-perm="payment" onclick="nav('payment_recv')"><span class="icon">💰</span>收款管理</div>
      <div class="nav-item" data-perm="payment" onclick="nav('payment_pay')"><span class="icon">💸</span>付款管理</div>
      <div class="nav-item" data-perm="reconciliation" onclick="nav('reconciliation')"><span class="icon">🧮</span>对账管理</div>
      <div class="nav-item" data-perm="expense" onclick="nav('expense')"><span class="icon">🧾</span>费用单据</div>
      <div class="nav-item" data-perm="expense" onclick="nav('expense_report')"><span class="icon">📒</span>费用报表</div>
      <div class="nav-item" data-perm="commission" onclick="nav('commission')"><span class="icon">🤝</span>介绍提成</div>
    </div>
    <div class="nav-group">
      <div class="nav-title">发票</div>
      <div class="nav-item" data-perm="invoice" onclick="nav('inv_in')"><span class="icon">🧾</span>进项发票</div>
      <div class="nav-item" data-perm="invoice" onclick="nav('inv_out')"><span class="icon">🧾</span>出项发票</div>
    </div>
    <div class="nav-group">
      <div class="nav-title">项目管理</div>
      <div class="nav-item" data-perm="projects" onclick="nav('projects')"><span class="icon">📁</span>项目台账</div>
    </div>
    <div class="nav-group">
      <div class="nav-title">统计报表</div>
      <div class="nav-item" data-perm="stats" onclick="nav('stats')"><span class="icon">📈</span>数据报表</div>
    </div>
    <div class="nav-group">
      <div class="nav-title">系统管理</div>
      <div class="nav-item" data-perm="system" onclick="nav('system')"><span class="icon">🗄️</span>备份与导入导出</div>
      <div class="nav-item" data-perm="system" onclick="nav('period')"><span class="icon">📅</span>期末处理（封账/结转）</div>
      <div class="nav-item" data-perm="system" onclick="nav('opening')"><span class="icon">📒</span>期初建账设置</div>
      <div class="nav-item admin-only" data-perm="users" onclick="nav('users')" style="display:none"><span class="icon">👤</span>用户管理</div>
      <div class="nav-item" data-perm="system" onclick="nav('print_tpl')"><span class="icon">🖨️</span>打印模板</div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="menu-toggle" onclick="toggleSidebar()" aria-label="菜单">☰</button>
        <div class="topbar-title" id="page-title">工作台</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div class="topbar-info" id="top-date"></div>
        <div class="topbar-user" id="topbar-user" style="display:none">
          <span class="uname" id="topbar-uname"></span>
          <span class="urole" id="topbar-urole"></span>
          <span class="logout-btn" onclick="doLogout()" title="退出登录">⚡ 退出</span>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="sidebar-mask" onclick="closeSidebar()"></div>

<!-- 模态框容器 -->
<div id="modal-root"></div>

<script>

// ══════════════════════════════════════
// 工具函数
// ══════════════════════════════════════
async function request(method, path, body=null){
  const opts = {method, headers:{'Content-Type':'application/json','X-Token':getToken()}};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(API+path, opts);
  if(r.status === 401){
    // token 失效，重新登录
    showLoginOverlay('登录已过期，请重新登录');
    throw new Error('未登录');
  }
  if(!r.ok){
    const err = await r.json().catch(()=>({detail:'请求失败'}));
    throw new Error(err.detail || '请求失败');
  }
  return r.json();
}
const get = (p,q='') => request('GET', p+(q?'?'+q:''));
const post = (p,b) => request('POST',p,b);
const put = (p,b) => request('PUT',p,b);
const del = (p) => request('DELETE',p);

function fmtMoney(v){return v==null?'-':'¥'+(+v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function fmtNum(v,d=2){return v==null?'-':(+v).toFixed(d)}
function fmtDate(s){return s?s.substring(0,10):'-'}
function toast(msg,type='success'){
  const d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText=`position:fixed;top:20px;right:20px;z-index:9999;padding:10px 20px;border-radius:8px;
    background:${type==='success'?'#52c41a':type==='error'?'#ff4d4f':'#1677ff'};color:#fff;
    font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:fadeIn .2s`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),3000);
}
function confirm2(msg,cb){
  if(window.confirm(msg)) cb();
}
function showModal(title,html,footer=''){
  const m=document.createElement('div');
  m.className='modal-overlay';
  m.id='active-modal';
  m.innerHTML=`<div class="modal"><div class="modal-header"><h3>${title}</h3>
    <span class="modal-close" onclick="closeModal()">✕</span></div>
    <div class="modal-body">${html}</div>
    ${footer?`<div class="modal-footer">${footer}</div>`:''}
  </div>`;
  document.getElementById('modal-root').appendChild(m);
}
function closeModal(){
  const m=document.getElementById('active-modal');
  if(m) m.remove();
}

function escHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 用占位符填充模板
function fillPrintTemplate(tpl, data){
  let html = tpl;
  // 明细表
  if(html.indexOf('{{items}}') >= 0){
    const its = data.items || [];
    if(its.length){
      let rows = '';
      its.forEach((it, idx)=>{
        rows += '<tr><td>'+(idx+1)+'</td><td>'+escHtml(it.name)+'</td><td>'+escHtml(it.spec)+'</td><td>'+escHtml(it.unit)
          + '</td><td style="text-align:right">'+(it.qty!==''&&it.qty!=null?fmtNum(it.qty):'')+'</td>'
          + '<td style="text-align:right">'+(it.price!==''&&it.price!=null?fmtMoney(it.price):'')+'</td>'
          + '<td style="text-align:right">'+(it.amount!==''&&it.amount!=null?fmtMoney(it.amount):'')+'</td></tr>';
      });
      html = html.replace('{{items}}', '<table class="ptb"><thead><tr><th>序号</th><th>名称/商品</th><th>规格</th><th>单位</th><th style="text-align:right">数量</th><th style="text-align:right">单价</th><th style="text-align:right">金额</th></tr></thead><tbody>'+rows+'</tbody></table>');
    } else {
      html = html.replace('{{items}}', '');
    }
  }
  // 其余占位符
  const moneyKeys = ['amount','fee','tax_amount','untax_amount','total_amount','total_cost',
                     'gross_profit','balance_amount','total_order_amount','total_paid_amount','diff_amount','price'];
  html = html.replace(/\{\{\s*([\w]+)\s*\}\}/g, function(m, k){
    if(!(k in data)) return '';
    let v = data[k];
    if(v === null || v === undefined) return '';
    if(typeof v === 'number'){
      if(moneyKeys.indexOf(k) >= 0 && k !== 'tax_rate') return fmtMoney(v);
      return String(v);
    }
    return String(v);
  });
  return html;
}

// 将后端单据对象归一化为打印数据
function getPrintData(dt, raw){
  const co = _companyInfo || {};
  const base = {
    company: co.company_name||'', company_address: co.company_address||'',
    company_phone: co.company_phone||'', company_tax_no: co.company_tax_no||'',
    doc_no:'', doc_date:'', partner:'', operator: raw.operator||raw.business_person||'',
    amount:0, remark: raw.remark||'', print_time: new Date().toLocaleString('zh-CN'),
    items:[]
  };
  let items = [];
  if(dt === 'purchase'){
    Object.assign(base, {doc_no:raw.order_no, doc_date:fmtDate(raw.order_date),
      partner:raw.supplier_name||'', project_name:raw.project_name||'', warehouse_name:raw.warehouse_name||'',
      business_person:raw.business_person||'', tax_amount:raw.tax_amount||0, fee:raw.fee||0,
      total_amount:raw.total_amount||0, amount:raw.total_amount||0});
    items = (raw.items||[]).map(i=>({name:i.goods_name, spec:i.spec||'', unit:i.unit, qty:i.qty, price:i.unit_price, amount:i.total_amount}));
  } else if(dt === 'sale'){
    Object.assign(base, {doc_no:raw.order_no, doc_date:fmtDate(raw.order_date),
      partner:raw.customer_name||'', project_name:raw.project_name||'', warehouse_name:raw.warehouse_name||'',
      business_person:raw.business_person||'', gross_profit:raw.gross_profit||0, tax_amount:raw.tax_amount||0,
      fee:raw.fee||0, total_amount:raw.total_amount||0, amount:raw.total_amount||0});
    items = (raw.items||[]).map(i=>({name:i.goods_name, spec:i.spec||'', unit:i.unit, qty:i.qty, price:i.unit_price, amount:i.total_amount}));
  } else if(dt === 'requisition'){
    Object.assign(base, {doc_no:raw.order_no, doc_date:fmtDate(raw.req_date),
      partner:raw.project_name||'', project_name:raw.project_name||'', warehouse_name:raw.warehouse_name||'',
      applicant:raw.applicant||'', total_cost:raw.total_cost||0, amount:raw.total_cost||0});
    items = (raw.items||[]).map(i=>({name:i.goods_name, spec:'', unit:i.unit, qty:i.qty, price:'', amount:i.total_cost||''}));
  } else if(dt === 'check'){
    let tot = 0; (raw.items||[]).forEach(i=> tot += (i.diff_amount||0));
    Object.assign(base, {doc_no:raw.check_no, doc_date:fmtDate(raw.check_date),
      partner:raw.warehouse_name||'', warehouse_name:raw.warehouse_name||'',
      business_person:raw.business_person||'', total_diff:tot, amount:tot});
    items = (raw.items||[]).map(i=>({name:i.goods_name,
      spec:'系统 '+fmtNum(i.system_qty)+' / 实盘 '+fmtNum(i.actual_qty), unit:i.unit,
      qty:i.diff_qty, price:'', amount:i.diff_amount}));
  } else if(dt === 'payment'){
    Object.assign(base, {doc_no:raw.pay_no, doc_date:fmtDate(raw.pay_date),
      partner:raw.partner_name||'', bank_account_name:raw.bank_account_name||'',
      fee:raw.fee||0, pay_type_label:(raw.pay_type===1?'收款':'付款'), amount:raw.amount||0});
    items = (raw.relations||[]).map(r=>({name:r.order_no,
      spec:(r.order_type==='sale'?'销售单':'采购单'), unit:'', qty:'', price:'', amount:r.write_off_amount}));
  } else if(dt === 'invoice'){
    Object.assign(base, {doc_no:raw.invoice_no, invoice_no:raw.invoice_no, doc_date:fmtDate(raw.invoice_date),
      partner:raw.partner_name||'', invoice_code:raw.invoice_code||'', invoice_type:raw.invoice_type||'',
      project_name:raw.project_name||'', tax_rate:raw.tax_rate||0, untax_amount:raw.untax_amount||0,
      tax_amount:raw.tax_amount||0, total_amount:raw.total_amount||0, status:raw.status||'', amount:raw.total_amount||0});
  } else if(dt === 'expense'){
    Object.assign(base, {doc_no:raw.expense_no, doc_date:fmtDate(raw.expense_date),
      partner:'', category:raw.category||'', pay_account_name:raw.pay_account_name||'',
      business_person:raw.business_person||'', amount:raw.amount||0});
  } else if(dt === 'reconciliation'){
    Object.assign(base, {doc_no:raw.recon_no, doc_date:'',
      partner:raw.partner_name||'', recon_type_label:(raw.recon_type===1?'应收(销售)':'应付(采购)'),
      period_start:raw.period_start||'', period_end:raw.period_end||'',
      total_order_amount:raw.total_order_amount||0, total_paid_amount:raw.total_paid_amount||0,
      balance_amount:raw.balance_amount||0, amount:raw.balance_amount||0});
  }
  base.items = items;
  return base;
}

// 打印入口：preloaded 为可选（详情已加载的对象，避免重复请求）
async function printDoc(dt, id, preloaded){
  try{
    const [raw, tpl] = await Promise.all([
      preloaded || get(apiPathFor(dt) + '/' + id),
      get('/print/template/' + dt)
    ]);
    const data = getPrintData(dt, raw);
    data.doc_title = tpl.title || PRINT_DOC_TYPES[dt] || dt;
    const html = fillPrintTemplate(tpl.content, data);
    openPrintWindow(data.doc_title + ' ' + data.doc_no, html);
  }catch(e){ toast(e.message, 'error'); }
}

// 品牌下拉选项
function brandOpts(sel=''){
  return [('<option value="0">无品牌</option>'),
    ..._brands.filter(b=>b.status!==0).map(b=>`<option value="${b.id}" ${sel==b.id?'selected':''}>${b.name}</option>`)
  ].join('');
}

// 计量单位下拉选项
function unitOpts(sel='', allowEmpty=false){
  let opts = allowEmpty ? '<option value="">（无）</option>' : '';
  const names = _units.map(u=>u.name);
  // 当前值不在字典中时（旧数据/导入），先补一个选项避免丢失
  if(sel && !names.includes(sel)){
    opts += `<option value="${sel}" selected>${sel}（未在字典中）</option>`;
  }
  opts += _units.map(u=>`<option value="${u.name}" ${sel===u.name?'selected':''}>${u.name}</option>`).join('');
  opts += '<option value="__add__">➕ 新增单位…</option>';
  return opts;
}
// 计量单位下拉（含行内新增）；id 为 select 元素 id，sel 为当前选中单位名
function unitSelect(id, sel='', allowEmpty=false){
  return `<select id="${id}" onchange="onUnitSelectChange('${id}',${allowEmpty})">${unitOpts(sel, allowEmpty)}</select>`;
}
async function onUnitSelectChange(id, allowEmpty){
  const el = document.getElementById(id);
  if(el.value !== '__add__') return;
  const name = prompt('请输入新计量单位名称：');
  if(!name || !name.trim()){ // 取消则回退
    if(allowEmpty) el.value=''; else if(_units.length) el.value=_units[0].name; else el.value='';
    return;
  }
  try{
    await post('/units', {name: name.trim(), remark: ''});
    await loadBrandsAndCats();
    el.innerHTML = unitOpts(allowEmpty?'':name.trim(), allowEmpty);
    el.value = name.trim();
    toast('已添加单位','success');
  }catch(e){ toast(e.message,'error'); }
}

// 分类下拉选项（扁平，带缩进显示层级）
function categoryOpts(sel='', parentId=0, depth=0){
  const indent = '　'.repeat(depth);
  let opts = depth===0 ? '<option value="0">无分类</option>' : '';
  const children = _categories.filter(c=> (c.parent_id||0) === parentId);
  for(const c of children){
    opts += `<option value="${c.id}" ${sel==c.id?'selected':''}>${indent}${c.name}</option>`;
    opts += categoryOpts(sel, c.id, depth+1);
  }
  return opts;
}

// 构建分类树 HTML（用于管理页面）
function renderCatTree(items, parentId=0, depth=0){
  const children = items.filter(c=>(c.parent_id||0)===parentId);
  if(!children.length) return '';
  const pad = depth*20;
  return children.map(c=>`
    <div style="padding-left:${pad}px;display:flex;align-items:center;gap:8px;padding-top:6px;padding-bottom:6px;border-bottom:1px solid #f0f0f0">
      <span style="color:#999;font-size:12px">${['','一','二','三'][c.level]||''}级</span>
      <b style="flex:1">${c.name}</b>
      <button class="btn-link" onclick="editCategory(${c.id},'${c.name.replace(/'/g,"\\'")}',${c.parent_id||0},${c.sort_order||0})">编辑</button>
      ${c.level<3?`<button class="btn-link" onclick="editCategory(null,'',${c.id},0)">➕子分类</button>`:''}
      <button class="btn-link" style="color:var(--danger)" onclick="confirm2('确认删除「${c.name}」？',()=>delCategory(${c.id}))">删除</button>
    </div>
    ${renderCatTree(items, c.id, depth+1)}
  `).join('');
}

function goodsOpts(sel=''){

// 提成测算：谈定总额按税点拆出「代扣税 + 实付」，并提示实付额会冲减毛利
function calcSOComm(){
  const amt=parseFloat(document.getElementById('so_comm')?.value)||0;
  const rate=parseFloat(document.getElementById('so_comm_rate')?.value)||0;
  const tip=document.getElementById('so_comm_tip');
  if(!tip) return;
  if(amt<=0){ tip.innerHTML='<span style="color:#bbb">未登记提成（本单无介绍方佣金）</span>'; return; }
  const tax=Math.round(amt*rate)/100;
  const payable=Math.round((amt-tax)*100)/100;
  tip.innerHTML=`谈定提成 <b style="color:var(--danger)">¥${amt.toFixed(2)}</b>　税点 <b>${rate}%</b>　`
    +`代扣税 <b style="color:var(--warning)">¥${tax.toFixed(2)}</b>　实付介绍方 <b style="color:var(--success)">¥${payable.toFixed(2)}</b>`
    +`<br><span style="color:#999;font-size:12px">这 ¥${amt.toFixed(2)} 会作为佣金成本冲减本单毛利，利润统计自动扣除，不会虚高。</span>`;
}
function setCommRate(v){
  const el=document.getElementById('so_comm_rate');
  if(el){ el.value=v; calcSOComm(); }
}
function warehouseOpts(sel=''){
  return _warehouses.map(w=>`<option value="${w.id}" ${sel==w.id?'selected':''}>${w.name}</option>`).join('');
}
function projectOpts(sel=''){
  return [('<option value="">无</option>'),..._projects.map(p=>`<option value="${p.id}" ${sel==p.id?'selected':''}>${p.code} - ${p.name}</option>`)].join('');
}
// 业务人员下拉（数据源为系统用户）。默认选中当前登录用户，便于快速填写
function userOpts(sel=''){

// 商品明细列宽拖拽（规格列），宽度自动记忆到 localStorage
function applyColWidth(inputPrefix, thId, w){
  try{ localStorage.setItem('wms_'+inputPrefix+'_w', String(w)); }catch(e){}
  document.querySelectorAll('[id^="'+inputPrefix+'_"]').forEach(el=>{ el.style.width=w+'px'; });
  const th=document.getElementById(thId); if(th) th.style.width=w+'px';
}
let _colResize=null;
function startColResize(e, inputPrefix, thId){
  e.preventDefault();
  const startX=e.clientX;
  const cur=parseInt(localStorage.getItem('wms_'+inputPrefix+'_w')||'70',10);
  _colResize={startX,cur,inputPrefix,thId};
  document.addEventListener('mousemove',_onColResize);
  document.addEventListener('mouseup',_endColResize);
}
function _onColResize(e){
  if(!_colResize) return;
  let w=Math.max(40,_colResize.cur+(e.clientX-_colResize.startX));
  applyColWidth(_colResize.inputPrefix,_colResize.thId,w);
}
function _endColResize(){
  _colResize=null;
  document.removeEventListener('mousemove',_onColResize);
  document.removeEventListener('mouseup',_endColResize);
}
function initColWidth(){
  applyColWidth('poi_spec','po_spec_th', parseInt(localStorage.getItem('wms_poi_spec_w')||'70',10));
  applyColWidth('poi_model','po_model_th', parseInt(localStorage.getItem('wms_poi_model_w')||'70',10));
  applyColWidth('soi_spec','so_spec_th', parseInt(localStorage.getItem('wms_soi_spec_w')||'70',10));
  applyColWidth('soi_model','so_model_th', parseInt(localStorage.getItem('wms_soi_model_w')||'70',10));
}
let poItemIdx=0;
function addPOItem(){
  poItemIdx++;
  const idx=poItemIdx;
  const tr=document.createElement('tr');
  tr.id=`poi_${idx}`;
  tr.innerHTML=`
    <td><select id="poi_g_${idx}" onchange="onPOGoodsChange(${idx})" style="width:160px"><option value="">请选择</option>${goodsOpts()}</select></td>
    <td><input id="poi_spec_${idx}" style="width:${localStorage.getItem('wms_poi_spec_w')||'70'}px" placeholder="规格"></td>
    <td><input id="poi_model_${idx}" style="width:${localStorage.getItem('wms_poi_model_w')||'70'}px" placeholder="型号"></td>
    <td><input id="poi_unit_${idx}" style="width:50px" value="个"></td>
    <td><input type="number" id="poi_qty_${idx}" value="1" min="0" oninput="calcPOTotal()" style="width:70px"></td>
    <td><input type="number" id="poi_price_${idx}" value="0" min="0" oninput="calcPOTotal()" style="width:90px"></td>
    <td><input type="number" id="poi_tax_${idx}" value="13" min="0" max="100" oninput="calcPOTotal()" style="width:55px"></td>
    <td id="poi_amt_${idx}" style="text-align:right">¥0.00</td>
    <td><button class="btn-link" style="color:var(--danger)" onclick="removePOItem(${idx})">✕</button></td>`;
  document.getElementById('po_items_body').appendChild(tr);
}
function onPOGoodsChange(idx){
  const sel=document.getElementById(`poi_g_${idx}`);
  const opt=sel.options[sel.selectedIndex];
  document.getElementById(`poi_unit_${idx}`).value=opt.dataset.unit||'个';
  document.getElementById(`poi_price_${idx}`).value=opt.dataset.price||0;
  document.getElementById(`poi_tax_${idx}`).value=opt.dataset.tax||13;
  document.getElementById(`poi_spec_${idx}`).value=opt.dataset.spec||'';
  document.getElementById(`poi_model_${idx}`).value=opt.dataset.model||'';
  calcPOTotal();
}
function removePOItem(idx){document.getElementById(`poi_${idx}`)?.remove();calcPOTotal();}
async function scanAddPOItem(){
  const inp=document.getElementById('po_barcode');
  const code=(inp?.value||'').trim();
  if(!code) return;
  try{
    const g=await get('/goods/scan','code='+encodeURIComponent(code));
    addPOItem();
    const idx=poItemIdx;
    const sel=document.getElementById('poi_g_'+idx);
    sel.value=String(g.id);
    onPOGoodsChange(idx);
    const q=document.getElementById('poi_qty_'+idx);
    q.focus(); q.select();
    calcPOTotal();
    inp.value=''; inp.focus();
    toast('已添加：'+g.name,'success');
  }catch(e){
    toast(e.message||'未找到对应商品','error');
    inp.value=''; inp.focus();
  }
}
function calcPOTotal(){
  let total=0;
  document.querySelectorAll('[id^="poi_qty_"]').forEach(el=>{
    const idx=el.id.replace('poi_qty_','');
    const qty=+el.value||0;
    const price=+(document.getElementById(`poi_price_${idx}`)?.value)||0;
    const amt=qty*price;
    total+=amt;
    const amtEl=document.getElementById(`poi_amt_${idx}`);
    if(amtEl) amtEl.textContent='¥'+amt.toFixed(2);
  });
  const el=document.getElementById('po_total');
  if(el) el.textContent='¥'+total.toFixed(2);
}
async function savePurchaseOrder(){
  const wid=document.getElementById('po_wh').value;
  if(!wid){toast('请选择入库仓库','error');return;}
  const items=[];
  document.querySelectorAll('[id^="poi_g_"]').forEach(el=>{
    const idx=el.id.replace('poi_g_','');
    if(!el.value) return;
    items.push({
      goods_id:+el.value,
      spec:document.getElementById(`poi_spec_${idx}`)?.value||'',
      model:document.getElementById(`poi_model_${idx}`)?.value||'',
      unit:document.getElementById(`poi_unit_${idx}`)?.value||'',
      qty:+(document.getElementById(`poi_qty_${idx}`)?.value)||0,
      unit_price:+(document.getElementById(`poi_price_${idx}`)?.value)||0,

        <button type="button" class="btn btn-sm" onclick="setCmRate(10)">10%</button>
      </div></div>
  </div>
  <div id="cm_tip" style="margin:12px 0;padding:8px 12px;background:#fafafa;border:1px solid #f0f0f0;border-radius:6px;font-size:13px;color:#666"></div>
  <div style="font-size:12px;color:#999;line-height:1.7">
    本单已支付提成 <b>${fmtMoney(d.commission_paid||0)}</b>，应付实付 <b>${fmtMoney(d.commission_payable||0)}</b>。<br>
    保存后：毛利按「不含税收入 − 成本 − 提成实付（扣点后）」重算，利润统计里这笔佣金会自动扣掉，不会虚高。
  </div>`,
  `<button class="btn" onclick="closeModal()">取消</button>
   <button class="btn btn-primary" onclick="saveSaleCommission(${id})">保存</button>`);

}
function calcCmTip(){
  const amt=parseFloat(document.getElementById('cm_amt')?.value)||0;
  const rate=parseFloat(document.getElementById('cm_rate')?.value)||0;
  const tip=document.getElementById('cm_tip');
  if(!tip) return;
  if(amt<=0){ tip.innerHTML='<span style="color:#bbb">提成填 0 表示清除本单提成</span>'; return; }
  const tax=Math.round(amt*rate*100)/100;
  const payable=Math.round((amt-tax)*100)/100;
  tip.innerHTML=`谈定提成 <b style="color:var(--danger)">¥${amt.toFixed(2)}</b>　税点 <b>${rate}%</b>　`
    +`代扣税 <b style="color:var(--warning)">¥${tax.toFixed(2)}</b>　实付介绍方 <b style="color:var(--success)">¥${payable.toFixed(2)}</b>`
    +`<div style="margin-top:6px;color:#999;font-size:12px">计入本单成本（冲减毛利）的是扣点后实付 <b>¥${payable.toFixed(2)}</b>，代扣税由介绍方承担。</div>`;
}
function setCmRate(v){
  const el=document.getElementById('cm_rate');
  if(el){ el.value=v; calcCmTip(); }
}
async function saveSaleCommission(id){
  const refId=+document.getElementById('cm_ref').value||0;
  const amt=parseFloat(document.getElementById('cm_amt').value)||0;
  const rate=parseFloat(document.getElementById('cm_rate').value)||0;
  if(amt>0 && !refId){ toast('请先选择介绍方','error'); return; }
  try{
    await put('/sale/'+id+'/commission',{
      referrer_id:refId, commission_amount:amt, commission_tax_rate:rate
    });
    toast('提成已保存，本单毛利已重算');
    closeModal();
    if(_curPage==='commission') nav('commission');
    else if(_curPage==='sale') loadSale();
    else nav(_curPage);
  }catch(e){ toast(e.message,'error') }
}

function onSOGoodsChange(idx){
  const sel=document.getElementById(`soi_g_${idx}`);

  document.getElementById(`soi_spec_${idx}`).value=opt.dataset.spec||'';
  document.getElementById(`soi_model_${idx}`).value=opt.dataset.model||'';

async function scanAddSOItem(){
  const inp=document.getElementById('so_barcode');
  const code=(inp?.value||'').trim();
  if(!code) return;
  try{
    const g=await get('/goods/scan','code='+encodeURIComponent(code));
    addSOItem();
    const idx=soItemIdx;
    const sel=document.getElementById('soi_g_'+idx);
    sel.value=String(g.id);
    onSOGoodsChange(idx);
    const q=document.getElementById('soi_qty_'+idx);
    q.focus(); q.select();
    calcSOTotal();
    inp.value=''; inp.focus();
    toast('已添加：'+g.name,'success');
  }catch(e){
    toast(e.message||'未找到对应商品','error');
    inp.value=''; inp.focus();
  }
}
function calcSOTotal(){
  let total=0;
  document.querySelectorAll('[id^="soi_qty_"]').forEach(el=>{
    const idx=el.id.replace('soi_qty_','');
    const qty=+el.value||0;
    const price=+(document.getElementById(`soi_price_${idx}`)?.value)||0;
    const amt=qty*price;
    total+=amt;
    const amtEl=document.getElementById(`soi_amt_${idx}`);
    if(amtEl) amtEl.textContent='¥'+amt.toFixed(2);
  });
  const el=document.getElementById('so_total');
  if(el) el.textContent='¥'+total.toFixed(2);
}
async function saveSaleOrder(){
  const wid=document.getElementById('so_wh').value;
  if(!wid){toast('请选择出库仓库','error');return;}
  const items=[];
  document.querySelectorAll('[id^="soi_g_"]').forEach(el=>{
    const idx=el.id.replace('soi_g_','');
    if(!el.value) return;
    items.push({
      goods_id:+el.value,
      spec:document.getElementById(`soi_spec_${idx}`)?.value||'',
      model:document.getElementById(`soi_model_${idx}`)?.value||'',
      unit:document.getElementById(`soi_unit_${idx}`)?.value||'',
      qty:+(document.getElementById(`soi_qty_${idx}`)?.value)||0,
      unit_price:+(document.getElementById(`soi_price_${idx}`)?.value)||0,
      tax_rate:+(document.getElementById(`soi_tax_${idx}`)?.value)||13,
    });
  });
  if(!items.length){toast('请添加商品明细','error');return;}
  try{
    const invNeed=document.getElementById('so_inv_yes')?.checked?1:0;
    const invTypeReq=invNeed?(document.getElementById('so_inv_type')?.value||''):'';
    const r=await post('/sale',{
      customer_id:+document.getElementById('so_cust').value||null,
      warehouse_id:+wid,
      project_id:+document.getElementById('so_proj').value||null,
      order_date:document.getElementById('so_date').value,
      business_person:document.getElementById('so_bp').value,
      remark:document.getElementById('so_rem').value,
      invoice_need:invNeed,
      invoice_type_req:invTypeReq,
      fee: parseFloat(document.getElementById('so_fee')?.value)||0,
      referrer_id: +document.getElementById('so_ref')?.value||0,
      commission_amount: parseFloat(document.getElementById('so_comm')?.value)||0,
      commission_tax_rate: parseFloat(document.getElementById('so_comm_rate')?.value)||0,
      items
    });
    toast(`销售单 ${r.order_no} 已保存`); closeModal(); loadSale();
  }catch(e){toast(e.message,'error')}
}

let mqItemIdx=0;
function addMQItem(){
  mqItemIdx++;
  const idx=mqItemIdx;
  const tr=document.createElement('tr');
  tr.id=`mqi_${idx}`;
  tr.innerHTML=`
    <td><select id="mqi_g_${idx}" onchange="onMQGoodsChange(${idx})" style="width:200px"><option value="">请选择</option>${goodsOpts()}</select></td>
    <td><input id="mqi_u_${idx}" list="req_unit_datalist" style="width:72px" value="个"></td>

  document.getElementById('mq_items_body').appendChild(tr);
}
function onMQGoodsChange(idx){
  const sel=document.getElementById(`mqi_g_${idx}`);
  const opt=sel.options[sel.selectedIndex];
  document.getElementById(`mqi_u_${idx}`).value=opt.dataset.unit||'个';

async function saveReqOrder(){
  const pid=document.getElementById('mq_p').value;
  const wid=document.getElementById('mq_w').value;
  if(!pid){toast('请选择项目','error');return;}
  if(!wid){toast('请选择仓库','error');return;}
  const items=[];
  document.querySelectorAll('[id^="mqi_g_"]').forEach(el=>{
    const idx=el.id.replace('mqi_g_','');
    if(!el.value) return;
    items.push({goods_id:+el.value,unit:document.getElementById(`mqi_u_${idx}`)?.value||'',
      qty:+(document.getElementById(`mqi_q_${idx}`)?.value)||0});
  });
  if(!items.length){toast('请添加商品明细','error');return;}
  try{
    const r=await post('/requisition',{project_id:+pid,warehouse_id:+wid,
      req_date:document.getElementById('mq_d').value,
      applicant:document.getElementById('mq_a').value,
      remark:document.getElementById('mq_rem').value, items});
    toast(`领用单 ${r.order_no} 已保存`); closeModal(); loadReq();
  }catch(e){toast(e.message,'error')}
}

async function loadInventory(){

  const rows=await get('/inventory',`keyword=${kw}&warehouse_id=${wid}&project_id=${pid}`);

    ?rows.map(r=>{

      if(r.stock_min>0&&r.qty<=r.stock_min) alert='<span class="tag tag-red">预警</span>';
      else if(r.qty<=0) alert='<span class="tag tag-orange">零库存</span>';
      return `<tr>
        <td>${r.goods_code}</td><td><b>${r.goods_name}</b></td>

const CHECK_STATUS={0:'草稿',1:'盘点中',2:'已完成'};
// 已保存过明细的盘点单（关闭时不再自动删除）
const savedCheckIds=new Set();
async function closeOrDeleteCheck(id){
  if(savedCheckIds.has(id)){ closeModal(); return; }
  confirm2('该盘点单尚未保存明细，关闭将删除此新建单据，确认？', async()=>{
    try{ await del('/check/'+id); toast('已删除未保存的盘点单'); closeModal(); loadChecks(); }
    catch(e){ toast(e.message,'error'); }
  });
}
async function delCheck(id){
  try{ await del('/check/'+id); toast('删除成功'); loadChecks(); }
  catch(e){ toast(e.message,'error'); }
}
async function loadChecks(){
  const op=encodeURIComponent(document.getElementById('ck_op_f').value);
  const bp=encodeURIComponent(document.getElementById('ck_bp_f').value);
  const rows=await get('/check',`operator=${op}&business_person=${bp}`);
  document.getElementById('check-tbody').innerHTML=rows.length
    ?rows.map(r=>`<tr>
      <td>${r.check_no}</td><td>${r.warehouse_name||'-'}</td>
      <td>${fmtDate(r.check_date)}</td>
      <td>${statusBadge(r.status,CHECK_STATUS)}</td>
      <td>${r.operator||'-'}</td>
      <td>${r.business_person||'-'}</td>
      <td>
        <button class="btn-link" onclick="viewCheck(${r.id})">查看明细</button>
        ${(r.status==0||r.status==1)?`<button class="btn-link" style="color:var(--danger)" onclick="confirm2('确认删除该盘点单？',()=>delCheck(${r.id}))">删除</button>`:''}
        ${(r.status==0||r.status==1)?`<button class="btn-link btn-success" onclick="confirmCheck(${r.id})">审核</button>`:''}
        ${r.status==2?`<button class="btn-link" onclick="doUnapprove('check',${r.id})">反审核</button><button class="btn-link" style="color:var(--danger)" onclick="doVoid('check',${r.id})">作废</button>`:''}
        ${r.status==3?`<button class="btn-link" onclick="doUnapprove('check',${r.id})">反审核</button>`:''}
      </td></tr>`).join('')
    :'<tr><td colspan="7" class="empty-tip">暂无盘点记录</td></tr>';
}

async function saveCheck(){

  if(!wid){toast('请选择仓库','error');return;}
  try{
    const r=await post('/check',{warehouse_id:+wid,

async function viewCheck(id){
  const d=await get('/check/'+id);
  showModal(`盘点单 - ${d.check_no}`,`
  <p style="margin-bottom:12px;color:#888;font-size:13px">仓库：${d.warehouse_name||'-'} | 日期：${fmtDate(d.check_date)} | 状态：${CHECK_STATUS[d.status]} | 执行人：${d.operator||'-'} | 业务人员：${d.business_person||'-'}</p>
  <table class="detail-table">
    <thead><tr><th>商品</th><th>单位</th><th>系统库存</th><th width="100">实盘数量</th><th>差异</th><th>差异金额</th></tr></thead>
    <tbody>
    ${d.items.map(i=>`<tr>
      <td>${i.goods_name}</td><td>${i.unit}</td>
      <td>${fmtNum(i.system_qty)}</td>
      <td><input type="number" id="ci_${i.id}" value="${i.actual_qty}" ${d.status==2?'disabled':''} oninput="updateCheckDiff(${i.id},${i.system_qty},${i.cost_price})" style="width:90px;padding:3px 6px;border:1px solid #d9d9d9;border-radius:4px"></td>
      <td id="cd_${i.id}" style="color:${i.diff_qty>0?'#52c41a':i.diff_qty<0?'#ff4d4f':'#333'}">${i.diff_qty>0?'+':''}${fmtNum(i.diff_qty)}</td>
      <td id="cda_${i.id}">${fmtMoney(i.diff_amount)}</td>
    </tr>`).join('')}
    </tbody>
  </table>`,
  d.status==2
    ?`<button class="btn" onclick="closeModal()">关闭</button>
      <button class="btn" onclick="printDoc('check',${id})">🖨 打印</button>`
    :`<button class="btn" onclick="closeModal()">关闭</button>
      <button class="btn" onclick="printDoc('check',${id})">🖨 打印</button>
      <button class="btn" onclick="closeOrDeleteCheck(${id})">关闭</button>
      <button class="btn" onclick="printDoc('check',${id})">🖨 打印</button>
      <button class="btn btn-primary" onclick="saveCheckItems(${id})">保存数量</button>`);
}
function updateCheckDiff(iid,sysQty,costPrice){
  const actual=+(document.getElementById('ci_'+iid).value)||0;
  const diff=actual-sysQty;
  const diffAmt=diff*costPrice;
  const de=document.getElementById('cd_'+iid);
  const dae=document.getElementById('cda_'+iid);

// 从待开票单据直接开具发票：预填单据信息并保存后关联到该单据
function openInvoiceFromOrder(idx){
  const r=_pendingRows[idx];
  if(!r) return;
  const dir = r.order_type==='sale' ? 2 : 1;   // 销售出库→出项发票；采购入库→进项发票
  const req = r.invoice_type_req||'';
  let itype='增值税普通发票';
  if(req==='增值税发票') itype='增值税专用发票';
  else if(req==='收据') itype='收据';
  const preset={
    partner_id: r.partner_id||null,
    project_id: r.project_id||0,
    invoice_type: itype,
    total_amount: r.remaining_amount||0,
    relations:[{order_type:r.order_type, order_id:r.id, order_no:r.order_no, amount:(r.remaining_amount||0)}]
  };
  editInvoice(null, dir, preset);
}

let _ivNewImg='', _ivNewOcr='', _ivPresetRelations=null;
function ivOnImage(input){
  const btn=document.getElementById('iv_rec_btn');
  const prev=document.getElementById('iv_img_prev');
  const hint=document.getElementById('iv_rec_hint');
  if(input.files && input.files[0]){
    btn.disabled=false;
    const f=input.files[0];
    const isPdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
    if(isPdf){
      prev.innerHTML=`<div style="display:flex;align-items:center;gap:8px;color:#555"><span style="font-size:28px">📄</span><span>已选择 PDF：${f.name}</span></div>`;
    }else{
      const url=URL.createObjectURL(f);
      prev.innerHTML=`<img src="${url}" style="max-width:180px;max-height:140px;border:1px solid #ddd;border-radius:6px">`;
    }
    hint.textContent='已选择，点击「识别」自动填单';
  }else{
    btn.disabled=true; prev.innerHTML='';
  }
}
async function ivRecognize(){
  const input=document.getElementById('iv_img');
  if(!input.files||!input.files[0]){toast('请先选择图片','error');return;}
  const btn=document.getElementById('iv_rec_btn');
  const hint=document.getElementById('iv_rec_hint');
  btn.disabled=true; hint.textContent='识别中…';
  try{
    const fd=new FormData();
    fd.append('file',input.files[0]);
    const r=await fetch(API+'/invoices/upload',{method:'POST',headers:{'X-Token':getToken()},body:fd});
    if(!r.ok){const e=await r.json().catch(()=>({detail:'识别失败'}));throw new Error(e.detail||'识别失败');}
    const d=await r.json();
    _ivNewImg=d.image_path||'';
    _ivNewOcr=d.raw||'';
    if(d.invoice_no) document.getElementById('iv_no').value=d.invoice_no;
    if(d.invoice_code) document.getElementById('iv_code').value=d.invoice_code;
    if(d.invoice_date) document.getElementById('iv_date').value=d.invoice_date;
    if(d.tax_rate) document.getElementById('iv_taxrate').value=d.tax_rate;
    if(d.untax_amount) document.getElementById('iv_untax').value=d.untax_amount;
    if(d.tax_amount) document.getElementById('iv_tax').value=d.tax_amount;
    if(d.total_amount) document.getElementById('iv_total').value=d.total_amount;
    hint.textContent='识别完成（引擎：'+(d.engine||'?')+'），请核对后保存';
    toast('识别完成');
  }catch(e){hint.textContent='';toast(e.message,'error');}
  finally{btn.disabled=false;}
}
function ivPreview(id){
  showModal('发票图片/PDF',`<iframe src="${API}/invoices/image/${id}" style="width:100%;height:70vh;border:0"></iframe>`);
}
function calcInvAmt(){
  const untax=+(document.getElementById('iv_untax')?.value)||0;
  const rate=+(document.getElementById('iv_taxrate')?.value)||0;
  const tax=untax*rate/100;
  const el=document.getElementById('iv_tax');
  const tel=document.getElementById('iv_total');
  if(el) el.value=tax.toFixed(2);
  if(tel) tel.value=(untax+tax).toFixed(2);
}
function calcInvTotal(){
  const untax=+(document.getElementById('iv_untax')?.value)||0;
  const tax=+(document.getElementById('iv_tax')?.value)||0;
  const el=document.getElementById('iv_total');
  if(el) el.value=(untax+tax).toFixed(2);
}
async function saveInvoice(id,dir){
  const body={
    invoice_no:document.getElementById('iv_no').value,
    invoice_code:document.getElementById('iv_code').value,
    invoice_type:document.getElementById('iv_type').value,
    direction:dir,
    partner_id:+document.getElementById('iv_partner').value||null,
    project_id:+document.getElementById('iv_proj').value||0,
    invoice_date:document.getElementById('iv_date').value,
    tax_rate:+document.getElementById('iv_taxrate').value,
    untax_amount:+document.getElementById('iv_untax').value,
    tax_amount:+document.getElementById('iv_tax').value,
    total_amount:+document.getElementById('iv_total').value,
    status:document.getElementById('iv_st').value,
    remark:document.getElementById('iv_rem').value,
    image_path:_ivNewImg,
    ocr_raw:_ivNewOcr
  };
  // 选单开具：保存时附带单据关联，关联金额取本次发票实际价税合计
  if(_ivPresetRelations && _ivPresetRelations.length){
    body.relations = _ivPresetRelations.map(x=>({...x, amount: body.total_amount}));
  }
  try{
    id?await put('/invoices/'+id,body):await post('/invoices',body);
    _ivNewImg=''; _ivNewOcr=''; _ivPresetRelations=null;
    toast('保存成功'); closeModal(); loadInvoices(dir); loadPendingInvoice(dir==1?'purchase':'sale');
  }catch(e){toast(e.message,'error')}
}
async function delInvoice(id,dir){
  try{await del('/invoices/'+id);toast('已作废');loadInvoices(dir);}catch(e){toast(e.message,'error')}
}

  el.innerHTML = `<table><thead><tr><th>任务/阶段</th><th>负责人</th><th>开始</th><th>结束</th><th>进度</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;

function renderGantt(){
  const tasks = _curPjTasks || [];
  const el = document.getElementById('gantt-body');
  if(!el) return;
  const dated = tasks.filter(t=>t.start_date && t.end_date && !isNaN(new Date(t.start_date)) && !isNaN(new Date(t.end_date)));
  if(!dated.length){
    el.innerHTML = '<div class="empty-tip" style="padding:30px;text-align:center;color:#999">暂无带起止日期的任务。请在「项目流程」中给任务设置开始/结束日期，甘特图将自动生成。</div>';
    return;
  }
  const toTs = s=>new Date(s).getTime();
  let min = Math.min.apply(null, dated.map(t=>toTs(t.start_date)));
  let max = Math.max.apply(null, dated.map(t=>toTs(t.end_date)));
  const today = new Date(); today.setHours(0,0,0,0);
  const todayTs = today.getTime();
  min = Math.min(min, todayTs);
  max = Math.max(max, todayTs, min+86400000);
  const span = max - min;
  const pct = ts => (ts - min)/span*100;
  const months = [];
  let d = new Date(min); d.setDate(1);
  while(d.getTime() <= max){ months.push(new Date(d)); d.setMonth(d.getMonth()+1); }
  const head = months.map(m=>{
    const left = pct(m.getTime());
    const nx = new Date(m); nx.setMonth(m.getMonth()+1);
    const w = Math.max(pct(Math.min(nx.getTime(),max))-left, 2);
    return `<div class="gantt-month" style="left:${left}%;width:${w}%">${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}</div>`;
  }).join('');
  const colors={1:'#bfbfbf',2:'#1677ff',3:'#52c41a',4:'#ff4d4f'};
  const rows = dated.map(t=>{
    const s=toTs(t.start_date), e=toTs(t.end_date);
    const left=pct(s), width=Math.max(pct(e)-left,1);
    const bc=colors[t.status]||'#1677ff';
    const prog=Math.max(0,Math.min(100,+(t.progress||0)));
    return `<div class="gantt-row"><div class="gantt-label" title="${t.name}">${t.name}</div>
      <div class="gantt-track"><div class="gantt-bar" style="left:${left}%;width:${width}%;background:${bc}" title="${t.name}｜${t.start_date}~${t.end_date}｜进度${prog}%">
      <div class="gantt-progress" style="width:${prog}%"></div></div></div></div>`;
  }).join('');
  const todayLeft = (todayTs>=min && todayTs<=max)? pct(todayTs) : null;
  const todayLine = todayLeft!=null ? `<div class="gantt-today" style="left:calc(160px + (100% - 160px) * ${todayLeft/100})"></div>` : '';
  el.innerHTML = `<div class="gantt">
    <div class="gantt-head"><div class="gantt-label">任务/阶段</div>
      <div class="gantt-track" style="min-height:26px">${head}</div></div>
    ${rows}
    ${todayLine}
  </div>`;
}
async function delProject(id){
  let cnt=0;
  try{
    const [ps,ss,qs,isv]=await Promise.all([
      get('/purchase',`project_id=${id}&status=-1`),
      get('/sale',`project_id=${id}&status=-1`),
      get('/requisition',`project_id=${id}&status=-1`),
      get('/invoices',`project_id=${id}`)
    ]);
    cnt=(ps.length||0)+(ss.length||0)+(qs.length||0)+(isv.length||0);
  }catch(e){}
  const msg = cnt>0
    ? `确认删除该项目？其下关联的 ${cnt} 条业务单据（采购/销售/耗材/发票）及任务将一并彻底删除，不可恢复！`
    : '确认删除该项目？其下任务将一并删除，此操作不可恢复！';
  confirm2(msg, ()=>doDelProject(id));
}

        ${_partners.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
      </select>
      <input id="pk_df" type="month" value="${today}" style="width:120px">
      <input id="pk_dt" type="month" value="${today}" style="width:120px">

    </div>

  </div>
  <div class="card" style="margin-bottom:16px;background:#fffbe6;border:1px solid #ffe58f">
    <div style="font-weight:600;color:#d48806;margin-bottom:8px">📋 待${isRecv?'收':'付'}单据（${isRecv?'已审核销售单未结清':'已审核采购单未结清'}，点击右侧按钮可直接${isRecv?'收款':'付款'}）</div>
    <div class="table-wrap"><table><thead><tr>
      <th>单据号</th><th>日期</th><th>往来单位</th>
      <th>${isRecv?'应收':'应付'}金额</th><th>已${isRecv?'收':'付'}</th><th>未结</th><th>操作</th>
    </tr></thead><tbody id="pending-tbody"></tbody></table></div>
  </div>
  <div id="pay-summary" style="display:flex;gap:16px;margin-bottom:12px"></div>
  <div class="table-wrap"><table><thead><tr>
    <th>单号</th><th>日期</th><th>${isRecv?'收款方':'付款方'}</th>
    <th>银行账户</th><th>金额</th><th>手续费</th>
    <th>备注</th><th>操作</th>
  </tr></thead>
  <tbody id="pay-tbody"></tbody></table></div></div>`;
  loadPayments(payType);
  loadPendingPage(payType);
}

async function loadPendingPage(payType){
  const box=document.getElementById('pending-tbody');
  if(!box) return;
  box.innerHTML='<tr><td colspan="7" style="color:#888">加载中...</td></tr>';
  try{
    const pid=document.getElementById('pk_partner')?.value||'-1';
    const rows=await get('/finance/pending-orders', `pay_type=${payType}&partner_id=${pid}`);
    const lbl=payType===1?'收':'付';
    if(!rows || !rows.length){
      box.innerHTML='<tr><td colspan="7" style="color:#888">暂无待'+lbl+'单据（已审核且未结清的出入库单才会显示）</td></tr>';
      return;
    }
    box.innerHTML=rows.map(r=>`<tr>
      <td>${r.order_no||'-'}</td>
      <td>${r.order_date||'-'}</td>
      <td>${r.partner_name||'-'}</td>
      <td>${fmtMoney(r.total_amount)}</td>
      <td>${fmtMoney(r.paid_amount)}</td>
      <td><b style="color:var(--danger)">${fmtMoney(r.remaining)}</b></td>
      <td><button class="btn-link btn-success" onclick="editPayment(null,${payType},{partnerId:${r.partner_id},orderId:${r.order_id},orderType:'${r.order_type}'})">${payType===1?'收款':'付款'}</button></td>
    </tr>`).join('');
  }catch(e){
    box.innerHTML='<tr><td colspan="7" style="color:var(--danger)">加载失败</td></tr>';
  }
}

async function loadPayments(payType){
  const kw=document.getElementById('pk_kw')?.value||'';
  const pid=document.getElementById('pk_partner')?.value||'-1';
  const df=(document.getElementById('pk_df')?.value||'')+'-01';
  const dtM=document.getElementById('pk_dt')?.value||'';
  let dt='';
  if(dtM){const d=new Date(dtM+'-01');d.setMonth(d.getMonth()+1);d.setDate(0);dt=d.toISOString().slice(0,10);}
  const rows=await get('/payments',
    `pay_type=${payType}&partner_id=${pid}&date_from=${df}&date_to=${dt}&keyword=${encodeURIComponent(kw)}`);
  const total=rows.reduce((s,r)=>s+r.amount,0);
  const fee=rows.reduce((s,r)=>s+(r.fee||0),0);
  const sumEl=document.getElementById('pay-summary');
  if(sumEl) sumEl.innerHTML=`
    <div style="background:#f6ffed;border:1px solid #b7eb8f;border-radius:6px;padding:8px 16px">
      <span style="color:#52c41a;font-weight:600">共 ${rows.length} 笔</span>
      <span style="margin-left:12px">合计金额：<b style="color:var(--primary)">${fmtMoney(total)}</b></span>
      ${fee>0?`<span style="margin-left:12px;color:#888">手续费合计：${fmtMoney(fee)}</span>`:''}
    </div>`;
  const tbody=document.getElementById('pay-tbody');
  if(!tbody) return;
  tbody.innerHTML=rows.length?rows.map(r=>`<tr>
    <td>${r.pay_no}</td>
    <td>${r.pay_date||'-'}</td>
    <td>${r.partner_name||'-'}</td>
    <td>${r.bank_account_name||'-'}<br><small style="color:#aaa">${r.bank_account_no||''}</small></td>
    <td><b style="color:var(--success)">${fmtMoney(r.amount)}</b></td>
    <td>${r.fee>0?fmtMoney(r.fee):'-'}</td>
    <td>${r.remark||'-'}</td>
      <td>
        <button class="btn-link" onclick="viewPayment(${r.id})">查看</button>
        ${r.audit_status===0?`<button class="btn-link btn-success" onclick="doApprove('payment',${r.id})">审核</button>`:''}
        ${r.audit_status===0?`<button class="btn-link" style="color:var(--danger)" onclick="confirm2('确认撤销该${payType===1?'收款':'付款'}？余额将回滚！',()=>cancelPayment(${r.id},${payType}))">撤销</button>`:''}
        ${r.audit_status===1?`<button class="btn-link" onclick="doUnapprove('payment',${r.id})">反审核</button><button class="btn-link" style="color:var(--danger)" onclick="doVoid('payment',${r.id})">作废</button>`:''}
        ${r.audit_status===2?`<button class="btn-link" onclick="doUnapprove('payment',${r.id})">反审核</button>`:''}
      </td></tr>`).join('')
    :'<tr><td colspan="8" class="empty-tip">暂无数据</td></tr>';
}

// 加载待收/待付订单（按往来单位过滤），渲染可选单据表格
async function loadPendingOrders(payType, partnerId){
  const box=document.getElementById('fp_order_list');
  if(!box) return;
  box.innerHTML='<span style="color:#888;font-size:12px">加载中...</span>';
  try{
    const q='pay_type='+payType+'&partner_id='+(partnerId||-1);
    const rows=await get('/finance/pending-orders', q);
    renderPendingOrders(payType, rows);
  }catch(e){ box.innerHTML='<span style="color:var(--danger);font-size:12px">加载失败</span>'; }
}
function renderPendingOrders(payType, rows){
  const box=document.getElementById('fp_order_list');
  if(!box) return;
  if(!rows || !rows.length){
    box.innerHTML='<div style="color:#888;font-size:12px;padding:6px">暂无待'+(payType===1?'收':'付')+'单据（仅显示已审核且未结清的出入库单）</div>';
    return;
  }
  const label=payType===1?'应收':'应付';
  let html='<table class="tbl" style="font-size:12px"><thead><tr>'+
    '<th>选</th><th>单据号</th><th>日期</th><th>'+label+'金额</th><th>已'+label+'</th><th>未结</th><th>本次核销</th></tr></thead><tbody>';
  rows.forEach(r=>{
    html+='<tr>'+
      '<td><input type="checkbox" class="fp_ord_sel" data-id="'+r.order_id+'" data-type="'+r.order_type+'" data-no="'+r.order_no+'" data-rem="'+r.remaining+'"></td>'+
      '<td>'+r.order_no+'</td><td>'+(r.order_date||'')+'</td>'+
      '<td>'+fmtMoney(r.total_amount)+'</td><td>'+fmtMoney(r.paid_amount)+'</td>'+
      '<td><b style="color:var(--danger)">'+fmtMoney(r.remaining)+'</b></td>'+
      '<td><input type="number" class="fp_ord_wo" data-rem="'+r.remaining+'" step="0.01" min="0" value="'+r.remaining+'" style="width:92px" disabled></td>'+
    '</tr>';
  });
  html+='</tbody></table>';
  const openingItems=rows.filter(r=>r.order_type==='opening');
  let head='';
  if(openingItems.length){
    const tot=openingItems.reduce((s,r)=>s+(+r.remaining||0),0);
    head='<div style="background:#fffbe6;border:1px solid #ffe58f;color:#ad6800;font-size:12px;padding:6px 10px;margin-bottom:6px;border-radius:4px">📒 该单位期初欠款（未结）：<b>'+fmtMoney(tot)+'</b>，可在下方勾选「期初欠款」直接核销</div>';
  }
  box.innerHTML=head+html;
  box.querySelectorAll('.fp_ord_sel').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const tr=cb.closest('tr'); const wo=tr.querySelector('.fp_ord_wo');
      wo.value = cb.checked ? cb.dataset.rem : 0;
      wo.disabled = !cb.checked;
    });
  });
}

async function savePayment(payType){
  const amount=+document.getElementById('fp_amount').value||0;
  const bankId=+document.getElementById('fp_bank').value||0;
  const partnerId=+document.getElementById('fp_partner').value||0;
  if(amount<=0){toast('金额必须大于0','error');return;}
  if(!bankId){toast('请选择收付款账户','error');return;}
  // 收集勾选的核销单据
  const rels=[];
  document.querySelectorAll('#fp_order_list .fp_ord_sel').forEach(cb=>{
    if(!cb.checked) return;
    const tr=cb.closest('tr'); const wo=+tr.querySelector('.fp_ord_wo').value||0;
    if(wo<=0) return;
    rels.push({order_type:cb.dataset.type, order_id:+cb.dataset.id, order_no:cb.dataset.no, write_off_amount:wo});
  });
  const sumWo=rels.reduce((s,r)=>s+r.write_off_amount,0);
  if(sumWo>amount+0.01){toast('核销合计 '+fmtMoney(sumWo)+' 超过本次'+(payType===1?'收款':'付款')+'金额 '+fmtMoney(amount),'error');return;}
  const body={
    pay_type:payType,
    pay_date:document.getElementById('fp_date').value,
    partner_id:partnerId,
    bank_account_id:bankId,
    amount,fee:+document.getElementById('fp_fee').value||0,
    project_id:+document.getElementById('fp_proj').value||0,
    remark:document.getElementById('fp_remark').value,
    operator:document.getElementById('fp_op').value,
    relations:rels
  };
  try{
    const r=await post('/payments',body);
    toast(`${payType===1?'收款':'付款'}成功，单号：${r.pay_no}`);
    closeModal();await loadBankAccounts();loadPayments(payType);
  }catch(e){toast(e.message,'error')}
}

// 对账管理：展示已应用的期初应收/应付余额（点击查询即按筛选汇总）
async function renderOpeningBlock(t,p){
  const box=document.getElementById('opening-block');
  if(!box) return;
  try{
    const op=await get('/opening');
    if(!op.applied){ box.innerHTML='<div style="color:#888;font-size:13px;padding:8px 0">尚未应用期初建账，暂无期初应收/应付余额。</div>'; return; }
    let debt=(op.debt||[]).filter(d=>(t==='-1'||String(d.direction)===t) && (p==='-1'||String(d.partner_id)===p));
    if(!debt.length){ box.innerHTML='<div style="color:#888;font-size:13px;padding:8px 0">所选条件下无期初应收/应付余额。</div>'; return; }
    const sum=debt.reduce((s,d)=>s+(+d.balance||0),0);
    box.innerHTML=`<div style="font-weight:600;color:#389e0d;margin-bottom:8px">📒 期初${t==='1'?'应收':t==='2'?'应付':'应收/应付'}余额（已应用，点击「查询」即按上方筛选汇总显示）</div>
      <div class="table-wrap"><table><thead><tr><th>往来单位</th><th>方向</th><th>期初余额</th></tr></thead><tbody>
      ${debt.map(d=>`<tr><td>${d.partner_name||'-'}</td><td>${d.direction===1?'<span class="tag tag-blue">应收</span>':'<span class="tag tag-orange">应付</span>'}</td><td><b style="color:var(--danger)">${fmtMoney(d.balance)}</b></td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="2" style="text-align:right;font-weight:600">合计</td><td><b style="color:var(--danger)">${fmtMoney(sum)}</b></td></tr></tfoot></table></div>`;
  }catch(e){ box.innerHTML='<div style="color:var(--danger);font-size:13px">期初余额加载失败：'+(e.message||'')+'</div>'; }
}

      <div class="form-row"><label>业务人员</label><select id="exp_bp">${userOpts(d.business_person)}</select></div>
      <div class="form-row"><label>备注</label><input id="exp_rem" value="${d.remark||''}"></div>
      <div class="form-row" style="grid-column:span 2"><label>执行人</label><input value="${d.operator||''}" disabled style="background:#f5f5f5;color:#999"></div>
    </div>`,
    `<button class="btn btn-primary" onclick="saveExpense(${id})">保存</button>
     <button class="btn" onclick="closeModal()">取消</button>
     <button class="btn" onclick="printDoc('expense',${id})">🖨 打印</button>`);
  }catch(e){ toast(e.message,'error'); }
}

async function saveExpense(id){
  const amount=parseFloat(document.getElementById('exp_amount').value)||0;
  if(amount<=0){ toast('请输入金额','error'); return; }
  const body={
    expense_date: document.getElementById('exp_date').value,
    category: document.getElementById('exp_category').value,
    amount: amount,
    pay_account_id: +document.getElementById('exp_bank').value||0,
    business_person: document.getElementById('exp_bp').value,
    remark: document.getElementById('exp_rem').value
  };
  try{
    if(id>0){ await put('/expenses/'+id, body); toast('已保存','success'); }
    else { await post('/expenses', body); toast('已保存','success'); }
    closeModal(); loadExpenses();
  }catch(e){ toast(e.message,'error'); }
}

async function deleteExpense(id){
  try{ await del('/expenses/'+id); toast('已删除','success'); loadExpenses(); }
  catch(e){ toast(e.message,'error'); }
}

async function loadExpenseReport(){

    mBody.innerHTML = d.months.map(m=>{

// 期末处理（年底封账 / 结转）
// ══════════════════════════════════════════════════════
async function pagePeriod(){
  const c = document.getElementById('content');
  c.innerHTML = '<div class="card"><div style="text-align:center;padding:30px;color:#aaa">加载中…</div></div>';
  let d;
  try{ d = await get('/period/years'); }
  catch(e){ c.innerHTML = '<div class="card"><div style="color:red">加载失败：'+e.message+'</div></div>'; return; }
  const cur = d.current_year;
  const STATUS = {0:'未封账', 1:'已封账', 2:'已封账并结转'};
  const STATUS_COLOR = {0:'#999', 1:'#faad14', 2:'#52c41a'};
  const rows = d.years.map(y=>{
    let ops = '';
    if(y.status===0){
      ops = `<button class="btn btn-primary" onclick="periodClose(${y.year})">🔒 封账</button>`;
    } else if(y.status===1){
      ops = `<button class="btn" style="color:var(--primary)" onclick="periodCarry(${y.year})">🔄 结转</button>
             <button class="btn" style="color:var(--danger)" onclick="periodReopen(${y.year})">🔓 反封账</button>`;
    } else {
      ops = `<button class="btn" style="color:var(--primary)" onclick="periodOpening(${y.year})">👁 查看期初</button>
             <button class="btn" style="color:var(--danger)" onclick="periodReopen(${y.year})">🔓 反封账</button>`;
    }
    const isCur = y.year===cur ? ' <span style="color:var(--primary);font-size:12px">（本年度）</span>' : '';
    return `<tr>
      <td><b>${y.year}</b>${isCur}</td>
      <td><span style="color:${STATUS_COLOR[y.status]};font-weight:600">${STATUS[y.status]}</span></td>
      <td>${y.closed_at||'-'}</td>
      <td>${y.closed_by||'-'}</td>
      <td>${ops}</td>
    </tr>`;
  }).join('');
  c.innerHTML = `
  <div class="card" style="max-width:960px">
    <div style="font-size:16px;font-weight:700;margin-bottom:6px">📅 期末处理（年底封账 / 结转）</div>
    <div style="color:#888;font-size:13px;margin-bottom:14px;line-height:1.7">
      <b>封账</b>：锁定某会计年度，禁止再向该年新增 / 修改 / 删除任何业务单据（采购、销售、领用、收付款、费用、发票、盘点）。<br>
      <b>结转</b>：将封账年度的期末余额生成为下一年度的<b>期初余额</b>（库存 / 应收应付 / 银行账户），便于跨年连续核算。<br>
      <span style="color:#faad14">提示：建议按年份顺序封账；如需修改已封账年份的数据，请先「反封账」。</span>
    </div>
    <div class="table-wrap">
      <table><thead><tr>
        <th>会计年度</th><th>状态</th><th>封账时间</th><th>封账人</th><th>操作</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:#aaa">暂无数据</td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

async function periodClose(year){
  if(!confirm(`确定封账 ${year} 年吗？\n封账后该年所有业务单据将被锁定，无法再新增/修改/删除。`)) return;
  try{
    const r = await post('/period/close', {year});
    if(r.warn_earlier_open && r.warn_earlier_open.length){
      toast(`已封账 ${year} 年（提醒：更早的 ${r.warn_earlier_open.join('、')} 年尚未封账）`,'success');
    } else {
      toast(`已封账 ${year} 年`,'success');
    }
    pagePeriod();
  }catch(e){ toast(e.message,'error'); }
}

async function periodReopen(year){
  if(!confirm(`确定对 ${year} 年执行「反封账」吗？\n将解除封账，并清除该年结转产生的下年期初数据。`)) return;
  try{
    await post('/period/reopen', {year});
    toast(`已反封账 ${year} 年`,'success');
    pagePeriod();
  }catch(e){ toast(e.message,'error'); }
}

async function periodCarry(year){
  if(!confirm(`确定将 ${year} 年的期末余额结转至 ${year+1} 年作为期初吗？`)) return;
  try{
    const r = await post('/period/carry-forward', {year});
    toast(`结转完成：${year}→${year+1} 年（库存 ${r.inventory_items} 项 / 往来 ${r.partner_items} 项 / 银行 ${r.bank_items} 项）`,'success');
    pagePeriod();
  }catch(e){ toast(e.message,'error'); }
}

async function periodOpening(year){
  let d;
  try{ d = await get('/period/opening/'+year); }
  catch(e){ toast('加载期初失败：'+e.message,'error'); return; }
  const inv = d.inventory, part = d.partners, bank = d.banks;
  const invHtml = inv.length ? `
    <div class="table-wrap"><table><thead><tr>
      <th>商品编码</th><th>名称</th><th>规格/型号</th><th>仓库</th><th>数量</th><th>单位</th><th>单位成本</th><th>总成本</th>
    </tr></thead><tbody>
    ${inv.map(r=>`<tr>
      <td>${r.code||''}</td><td>${r.name||''}</td>
      <td>${[r.spec,r.model].filter(Boolean).join('/')||'-'}</td>
      <td>${r.warehouse_name||''}</td>
      <td>${fmtNum(r.qty)}</td><td>${r.unit||''}</td>
      <td>${fmtMoney(r.avg_cost)}</td><td>${fmtMoney(r.total_cost)}</td>
    </tr>`).join('')}
    </tbody></table></div>` : '<div style="color:#aaa;padding:16px">无库存期初记录</div>';
  const partHtml = part.length ? `
    <div class="table-wrap"><table><thead><tr>
      <th>往来单位</th><th>类型</th><th>余额</th>
    </tr></thead><tbody>
    ${part.map(r=>`<tr>
      <td>${r.partner_name||''}</td>
      <td>${r.direction===1?'应收(客户)':'应付(供应商)'}</td>
      <td style="color:${r.balance>=0?'#333':'#ff4d4f'}">${fmtMoney(r.balance)}</td>
    </tr>`).join('')}
    </tbody></table></div>` : '<div style="color:#aaa;padding:16px">无往来期初记录</div>';
  const bankHtml = bank.length ? `
    <div class="table-wrap"><table><thead><tr>
      <th>账户</th><th>期初余额</th>
    </tr></thead><tbody>
    ${bank.map(r=>`<tr><td>${r.account_name||''}</td><td>${fmtMoney(r.balance)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div style="color:#aaa;padding:16px">无银行期初记录</div>';

  const body = `
    <div style="display:flex;gap:8px;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:8px">
      <button class="tab-btn" id="po-tab-inv" onclick="periodSwitchTab('inv')" style="border:none;background:none;cursor:pointer;padding:6px 14px;font-size:14px;border-bottom:2px solid var(--primary);color:var(--primary);font-weight:600">📊 库存期初(${inv.length})</button>
      <button class="tab-btn" id="po-tab-part" onclick="periodSwitchTab('part')" style="border:none;background:none;cursor:pointer;padding:6px 14px;font-size:14px;color:#666">🤝 往来期初(${part.length})</button>
      <button class="tab-btn" id="po-tab-bank" onclick="periodSwitchTab('bank')" style="border:none;background:none;cursor:pointer;padding:6px 14px;font-size:14px;color:#666">🏦 银行期初(${bank.length})</button>
    </div>
    <div id="po-pane-inv">${invHtml}</div>
    <div id="po-pane-part" style="display:none">${partHtml}</div>
    <div id="po-pane-bank" style="display:none">${bankHtml}</div>`;
  showModal(`${year} 年期初余额`, body, `<button class="btn" onclick="closeModal()">关闭</button>`);
}

function periodSwitchTab(t){
  ['inv','part','bank'].forEach(k=>{
    const p = document.getElementById('po-pane-'+k);
    if(p) p.style.display = (k===t)?'':'none';
    const b = document.getElementById('po-tab-'+k);
    if(b){
      const on = k===t;
      b.style.color = on?'var(--primary)':'#666';
      b.style.borderBottom = on?'2px solid var(--primary)':'none';
      b.style.fontWeight = on?'600':'400';
    }
  });
}

async function payCommissionForm(saleId){
  const d=await get('/sale/'+saleId);
  const unpaid=Math.round(((d.commission_payable||0)-(d.commission_paid||0))*100)/100;
  if(unpaid<=0){ toast('该单提成已付清','error'); return; }
  let banks=[];
  try{ banks=await get('/bank_accounts'); }catch(e){ banks=[]; }
  const today=new Date().toISOString().substring(0,10);
  showModal('支付介绍方提成',`
  <div class="form-grid">
    <div class="form-row"><label>销售单号</label>
      <input value="${d.order_no}" disabled style="background:#f5f5f5;color:#666"></div>
    <div class="form-row"><label>🤝 介绍方</label>
      <input value="${d.referrer_name||''}" disabled style="background:#f5f5f5;color:#666"></div>
    <div class="form-row"><label>剩余未付(元)</label>
      <input value="${unpaid.toFixed(2)}" disabled style="background:#f5f5f5;color:var(--danger);font-weight:600"></div>
    <div class="form-row"><label>本次支付(元)*</label>
      <input id="pc_amt" type="number" step="0.01" min="0" value="${unpaid.toFixed(2)}"></div>
    <div class="form-row"><label>支付日期</label>
      <input type="date" id="pc_date" value="${today}"></div>
    <div class="form-row"><label>付款账户</label>
      <select id="pc_bank"><option value="">不关联账户（现金/他人代付）</option>
        ${banks.map(b=>`<option value="${b.id}">${b.name}（余额 ${fmtMoney(b.balance)}）</option>`).join('')}
      </select></div>
    <div class="form-row" style="grid-column:span 3"><label>备注</label>
      <input id="pc_rem" placeholder="如：微信转账 / 现金 / 银行汇款"></div>
  </div>
  <div style="margin-top:10px;padding:8px 12px;background:#fafafa;border:1px solid #f0f0f0;border-radius:6px;font-size:12px;color:#999;line-height:1.7">
    本次支付只做两件事：扣所选银行账户余额、登记一笔支付流水。<br>
    提成在出库时已经整额冲减过毛利，这里不会再扣一次，利润统计不会重复。
  </div>`,
  `<button class="btn" onclick="closeModal()">取消</button>
   <button class="btn btn-primary" onclick="saveCommissionPay(${saleId})">确认支付</button>`);
}
async function saveCommissionPay(saleId){
  const amount=parseFloat(document.getElementById('pc_amt').value)||0;
  if(amount<=0){ toast('支付金额必须大于 0','error'); return; }
  try{
    await post('/commissions/'+saleId+'/pay',{
      amount,
      pay_date:document.getElementById('pc_date').value,
      bank_account_id:+document.getElementById('pc_bank').value||0,
      remark:document.getElementById('pc_rem').value||''
    });
    toast('提成支付已登记'); closeModal(); nav('commission');
  }catch(e){ toast(e.message,'error') }

function opEsc(s){ return (s==null?'':(''+s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 从 DOM 采集某页签当前所有行（保存/草稿共用）
function collectOpRows(tab){
  const items=[];
  const tb=document.getElementById('op-'+tab+'-tbody');
  if(!tb) return items;
  tb.querySelectorAll('tr').forEach(tr=>{
    if(tab==='inv'){
      const goods_id=+tr.querySelector('.op-inv-goods').value;
      const warehouse_id=+tr.querySelector('.op-inv-wh').value;
      const project_id=+(tr.querySelector('.op-inv-proj').value||0);
      const qty=parseFloat(tr.querySelector('.op-inv-qty').value)||0;
      const avg_cost=parseFloat(tr.querySelector('.op-inv-cost').value)||0;
      let total=parseFloat(tr.querySelector('.op-inv-amt').value);
      if(!total||total===0) total=Math.round(qty*avg_cost*100)/100;
      const remark=tr.querySelector('.op-inv-remark').value;
      if(goods_id&&warehouse_id) items.push({goods_id,warehouse_id,project_id,qty,avg_cost,total_cost:total,remark});
    } else if(tab==='debt'){
      const partner_id=+tr.querySelector('.op-debt-partner').value;
      const direction=+tr.querySelector('.op-debt-dir').value;
      const balance=parseFloat(tr.querySelector('.op-debt-bal').value)||0;
      const remark=tr.querySelector('.op-debt-remark').value;
      if(partner_id) items.push({partner_id,direction,balance,remark});
    } else if(tab==='bank'){
      const bank_account_id=+tr.querySelector('.op-bank-id').value;
      const balance=parseFloat(tr.querySelector('.op-bank-bal').value)||0;
      if(bank_account_id) items.push({bank_account_id,balance});
    } else if(tab==='cash'){
      const holder=tr.querySelector('.op-cash-holder').value.trim();
      const balance=parseFloat(tr.querySelector('.op-cash-bal').value)||0;
      const remark=tr.querySelector('.op-cash-remark').value;
      if(holder) items.push({holder,balance,remark});
    } else if(tab==='asset'){
      const name=tr.querySelector('.op-asset-name').value.trim();
      const category=tr.querySelector('.op-asset-cat').value.trim();
      const spec=tr.querySelector('.op-asset-spec').value.trim();
      const original_value=parseFloat(tr.querySelector('.op-asset-ov').value)||0;
      const accum_depreciation=parseFloat(tr.querySelector('.op-asset-ad').value)||0;
      const remark=tr.querySelector('.op-asset-remark').value;
      if(name) items.push({name,category,spec,original_value,accum_depreciation,remark});
    }
  });
  return items;
}

  _opTab=t;
  ['inv','debt','bank','cash','asset'].forEach(k=>{
    const b=document.getElementById('op-tab-'+k);
    if(b){
      const on=k===t;
      b.style.color=on?'var(--primary)':'#666';
      b.style.borderBottom=on?'2px solid var(--primary)':'none';
